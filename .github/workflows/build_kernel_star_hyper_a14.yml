name: Build Kernel • star_hyper_a14

on:
  workflow_dispatch:
    inputs:
      PROFILE_NAME:
        description: "Profile .env em Profiles/"
        required: true
        default: "star_hyper_a14.env"
      PYTHON_VERSION:
        description: "Versão do Python para toolchain scripts"
        required: true
        default: "3"

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      PROFILE_NAME: ${{ inputs.PROFILE_NAME }}
      PYTHON_VERSION: ${{ inputs.PYTHON_VERSION }}

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Mostrar versões do runner
        run: |
          uname -a
          lsb_release -a || true
          git --version

      - name: Carregar perfil
        id: envfile
        run: |
          set -euo pipefail
          test -f "Profiles/${PROFILE_NAME}" || { echo "::error::Perfil Profiles/${PROFILE_NAME} não encontrado"; exit 1; }
          # Normaliza EOL e remove linhas inválidas/comentários
          tmp=$(mktemp)
          sed -e 's/\r$//' -e '/^[[:space:]]*#/d' -e '/^[[:space:]]*$/d' "Profiles/${PROFILE_NAME}" > "$tmp"
          # Exporta variáveis do .env
          set -a
          . "$tmp"
          set +a

          echo "KERNEL_SOURCE=$KERNEL_SOURCE"
          echo "KERNEL_BRANCH=$KERNEL_BRANCH"
          echo "DEFCONFIG_NAME=$DEFCONFIG_NAME"
          echo "KERNELSU_BRANCH=$KERNELSU_BRANCH"

      - name: (Opcional) Baixar LLVM/Clang do perfil
        if: ${{ env.CLANG_SOURCE != '' }}
        run: |
          set -euo pipefail
          mkdir -p toolchains
          echo "Baixando: $CLANG_SOURCE"
          curl -L --retry 5 --retry-delay 5 "$CLANG_SOURCE" -o toolchains/clang.tar.xz
          echo "Verificando tarball…"
          tar -tJf toolchains/clang.tar.xz >/dev/null
          echo "Extraindo…"
          tar -xJf toolchains/clang.tar.xz -C toolchains
          # Detecta diretório base do clang extraído
          clang_dir=$(tar -tJf toolchains/clang.tar.xz | head -1 | cut -d/ -f1)
          echo "CLANG_PATH=$PWD/toolchains/$clang_dir" >> $GITHUB_ENV
          echo "PATH=$PWD/toolchains/$clang_dir/bin:$PATH" >> $GITHUB_ENV

      - name: Clonar fonte do Kernel
        run: |
          set -euo pipefail
          test -n "${KERNEL_SOURCE:-}" || { echo "::error::KERNEL_SOURCE não definido no perfil"; exit 3; }
          git clone --depth=1 -b "$KERNEL_BRANCH" "$KERNEL_SOURCE" device_kernel
          echo "OK: Kernel clonado em device_kernel"

      - name: Sanear Makefiles/Config (CRLF/BOM/TAB)
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y dos2unix
          find device_kernel -type f \( -name "Makefile" -o -name "*.mk" -o -name "Kconfig*" \) -print0 \
            | xargs -0 dos2unix || true
          # Corrige tabs/CRLF ocasionais em diretórios críticos
          sed -i 's/\r$//' device_kernel/drivers/input/touchscreen/focaltech_3680/Makefile || true

      - name: Compilar Kernel (defconfig + build)
        run: |
          set -euo pipefail
          cd device_kernel
          mkdir -p out

          # Toolchain env do perfil (se existir)
          # CUSTOM_CMDS/EXTRA_CMDS vêm do .env, então apenas exportamos aqui
          [ -n "${CUSTOM_CMDS:-}" ] && eval "export ${CUSTOM_CMDS}"
          [ -n "${EXTRA_CMDS:-}" ] && eval "export ${EXTRA_CMDS}"

          # Se CLANG_PATH foi definido, garante no PATH
          [ -n "${CLANG_PATH:-}" ] && export PATH="$CLANG_PATH/bin:$PATH"

          echo "Usando defconfig: ${DEFCONFIG_NAME}"
          make O=out ${DEFCONFIG_NAME}

          # Alguns trees exigem clean parcial para drivers antes do build
          make O=out -j"$(nproc --all)"

      - name: Empacotar com AnyKernel3
        run: |
          set -euo pipefail
          git clone --depth=1 -b "${AK3_BRANCH}" "${AK3_SOURCE}" ak3
          # Copia Image/boot artefatos comuns (ajuste conforme seu tree)
          if [ -f device_kernel/out/arch/arm64/boot/Image.gz-dtb ]; then
            cp device_kernel/out/arch/arm64/boot/Image.gz-dtb ak3/
          elif [ -f device_kernel/out/arch/arm64/boot/Image.gz ]; then
            cp device_kernel/out/arch/arm64/boot/Image.gz ak3/
          elif [ -f device_kernel/out/arch/arm64/boot/Image ]; then
            cp device_kernel/out/arch/arm64/boot/Image ak3/
          else
            echo "::error::Image de saída não encontrada"; exit 5
          fi
          (cd ak3 && zip -r9 ../Kernel-star_hyper_a14.zip .)

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-star_hyper_a14
          path: Kernel-star_hyper_a14.zip
