name: Build Kernel • star_hyper_a14

on:
  workflow_dispatch:
    inputs:
      PROFILE_NAME:
        description: "Nome do perfil em Profiles/ (ex.: star_hyper_a14)"
        type: string
        required: true
        default: "star_hyper_a14"
      PYTHON_VERSION:
        description: "Versão do Python para usar (2 ou 3)"
        type: choice
        options: ["2", "3"]
        required: true
        default: "3"

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout (repo deste workflow)
        uses: actions/checkout@v4

      - name: Prepare Configuration
        run: |
          echo "JOB_NAME=star_hyper_a14" >> "$GITHUB_ENV"
          echo "TZ=UTC" >> "$GITHUB_ENV"

      - name: Maximize build space (opcional)
        run: |
          sudo rm -rf /usr/local/lib/android || true
          df -h

      - name: Install necessary packages
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            bc bison flex build-essential git curl wget zip unzip rsync \
            python3 python2 tar xz-utils ccache \
            libssl-dev libelf-dev dwarves \
            clang lld llvm \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi   g++-arm-linux-gnueabi
          python3 --version
          python2 --version || true

      - name: Load profile and export variables (robusto)
        env:
          PROFILE_NAME: ${{ inputs.PROFILE_NAME }}
        run: |
          set -euo pipefail

          PROFILE_FILE="Profiles/${PROFILE_NAME}.env"
          if [ ! -f "$PROFILE_FILE" ]; then
            echo "Perfil não encontrado: $PROFILE_FILE"
            exit 1
          fi
          echo "-> Perfil: $PROFILE_FILE"

          # Converte o perfil para somente linhas KEY=VALUE,
          # ignorando comentários, vazios e os formatos CUSTOM_CMDS:/EXTRA_CMDS:
          awk '
            /^[[:space:]]*#/ {next}                       # comentários
            /^[[:space:]]*$/ {next}                       # linhas vazias

            # CUSTOM_CMDS:FOO=bar BAZ=qux  -> vira várias linhas KEY=VALUE
            /^(CUSTOM_CMDS|EXTRA_CMDS):/ {
              sub(/^[^:]*:/,"")                         # remove até o ':'
              gsub(/[[:space:]]+/,"\n")                 # quebra em tokens
              print
              next
            }

            # chaves válidas KEY=VAL (sem espaços ao redor do '=')
            /^[A-Za-z_][A-Za-z0-9_]*=.+$/ { print; next }
          ' "$PROFILE_FILE" > /tmp/parsed_profile.env

          echo ">>> Variáveis exportadas do perfil:"
          cat /tmp/parsed_profile.env | sed 's/^/  /'

          # Exporta cada KEY=VALUE para o ambiente do GitHub Actions
          while IFS='=' read -r k v; do
            [ -z "${k:-}" ] && continue
            printf '%s=%s\n' "$k" "$v" >> "$GITHUB_ENV"
          done < /tmp/parsed_profile.env

          # Defaults seguros se algo essencial não vier no perfil
          : "${KERNEL_SOURCE:=https://github.com/EndCredits/android_kernel_xiaomi_sm8350-miui.git}"
          : "${KERNEL_BRANCH:=hyper-14}"
          : "${DEFCONFIG_NAME:=vendor/star_defconfig}"
          : "${AK3_SOURCE:=https://github.com/osm0sis/AnyKernel3.git}"
          : "${AK3_BRANCH:=master}"

          {
            echo "KERNEL_SOURCE=${KERNEL_SOURCE}"
            echo "KERNEL_BRANCH=${KERNEL_BRANCH}"
            echo "DEFCONFIG_NAME=${DEFCONFIG_NAME}"
            echo "AK3_SOURCE=${AK3_SOURCE}"
            echo "AK3_BRANCH=${AK3_BRANCH}"
          } >> "$GITHUB_ENV"

      - name: Get Kernel Source (validação de variáveis)
        run: |
          set -euo pipefail
          echo "Clonando kernel:"
          echo "  SRC : ${KERNEL_SOURCE}"
          echo "  BR  : ${KERNEL_BRANCH}"
          git clone --depth=1 "${KERNEL_SOURCE}" -b "${KERNEL_BRANCH}" device_kernel

          echo "OK: repositório do kernel clonado em ./device_kernel"
          ls -la device_kernel | head -n 50

      - name: Get AnyKernel3 (opcional)
        run: |
          set -euo pipefail
          echo "Clonando AnyKernel3:"
          echo "  SRC : ${AK3_SOURCE}"
          echo "  BR  : ${AK3_BRANCH}"
          git clone --depth=1 "${AK3_SOURCE}" -b "${AK3_BRANCH}" AnyKernel3
          echo "OK: AnyKernel3 clonado em ./AnyKernel3"
          ls -la AnyKernel3 | head -n 50

     

      - name: Summary
        run: |
          echo "✓ Ambiente pronto e variáveis do perfil carregadas com sucesso."
          echo "✓ Repositórios kernel/AK3 clonados (validação)."
          echo "Agora você pode adicionar os passos de build."
