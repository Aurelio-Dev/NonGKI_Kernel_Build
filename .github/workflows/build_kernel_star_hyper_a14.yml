name: Build Kernel • star_hyper_a14

on:
  workflow_dispatch:
    inputs:
      PROFILE_NAME:
        description: "Arquivo de perfil em Profiles/ (ex.: star_hyper_a14.env)"
        required: true
        default: "star_hyper_a14.env"
      PYTHON_VERSION:
        description: "Versão do Python para toolings (2 ou 3)"
        required: true
        default: "3"

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      TZ: America/Sao_Paulo
      PROFILE_NAME: ${{ inputs.PROFILE_NAME }}
      PYTHON_VERSION: ${{ inputs.PYTHON_VERSION }}

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Mostrar versões do runner
        run: |
          set -euxo pipefail
          uname -a
          gcc --version || true
          clang --version || true
          python3 --version || true
          git --version

      - name: Carregar perfil
        id: load_env
        run: |
          set -euxo pipefail

          # Garante diretório e arquivo do perfil
          mkdir -p Profiles
          test -f "Profiles/${PROFILE_NAME}"
          echo "→ Perfil: Profiles/${PROFILE_NAME}"

          # Normaliza final de linha (CRLF -> LF)
          sed -i 's/\r$//' "Profiles/${PROFILE_NAME}"

          # Exporta KEY=VALUE
          while IFS= read -r raw || [ -n "$raw" ]; do
            [ -z "$raw" ] && continue
            case "$raw" in \#*) continue;; esac
            if printf '%s' "$raw" | grep -Eq '^[A-Za-z_][A-Za-z0-9_]*=.+$'; then
              k="${raw%%=*}"; v="${raw#*=}"
              v="${v%\"}"; v="${v#\"}"; v="${v%\'}"; v="${v#\'}"
              k="${k%$'\r'}"; v="${v%$'\r'}"
              echo "$k=$v" >> "$GITHUB_ENV"
              printf '  %s=%s\n' "$k" "$v"
            fi
          done < "Profiles/${PROFILE_NAME}"

          # Guard-rails
          test -n "${KERNEL_SOURCE:-}"  || { echo "::error::KERNEL_SOURCE não definido no perfil"; exit 2; }
          test -n "${DEFCONFIG_NAME:-}" || { echo "::error::DEFCONFIG_NAME não definido no perfil"; exit 2; }



      - name: (Opcional) Baixar LLVM/Clang do perfil
        if: ${{ env.CLANG_SOURCE != '' }}
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/clang"
          curl -L --retry 3 --retry-delay 3 "$CLANG_SOURCE" -o /tmp/clang.tar.xz
          tar -xJf /tmp/clang.tar.xz -C "$GITHUB_WORKSPACE/clang" --strip-components=1
          echo "$GITHUB_WORKSPACE/clang/bin" >> $GITHUB_PATH
          echo "LLVM=1"        >> $GITHUB_ENV
          echo "LLVM_IAS=1"    >> $GITHUB_ENV
          echo "LD=ld.lld"     >> $GITHUB_ENV

      - name: Instalar toolchain fallback (se não baixou clang)
        if: ${{ env.CLANG_SOURCE == '' }}
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev \
              libelf-dev ccache python3 python2 curl git rsync lz4 \
              gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi
          echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
          echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> $GITHUB_ENV

      - name: Clonar fonte do Kernel (robusto a branch ausente)
        run: |
          set -euxo pipefail
          rm -rf device_kernel

          SRC="${KERNEL_SOURCE}"
          # KERNEL_REF tem prioridade; se vazio, usa KERNEL_BRANCH; se não existir, cai no default branch
          REF="${KERNEL_REF:-${KERNEL_BRANCH:-}}"

          find_ref() {
            # retorna 0 se a ref existe como head ou tag
            if git ls-remote --heads "$SRC" "$1" | grep -q .; then
              echo "::notice::Encontrado branch '$1' no remoto."
              return 0
            fi
            if git ls-remote --tags "$SRC" "$1" | grep -q .; then
              echo "::notice::Encontrado tag '$1' no remoto."
              return 0
            fi
            return 1
          }

          if [ -n "$REF" ]; then
            if find_ref "$REF"; then
              git clone --depth=1 -b "$REF" "$SRC" device_kernel
              echo "KERNEL_TREE=$(pwd)/device_kernel" >> $GITHUB_ENV
              exit 0
            fi
            # Pode ser commit/ref arbitrária: clona padrão e dá fetch/checkout da ref
            if git ls-remote "$SRC" | grep -qi "$REF"; then
              git clone --depth=1 "$SRC" device_kernel
              cd device_kernel
              git fetch --depth=1 origin "$REF"
              git checkout --detach FETCH_HEAD
              cd ..
              echo "::notice::Usando ref arbitrária '$REF' (commit/ref)."
              echo "KERNEL_TREE=$(pwd)/device_kernel" >> $GITHUB_ENV
              exit 0
            fi
            echo "::warning::Referência '$REF' não encontrada; usando branch padrão do repositório."
          fi

          # Descobre o branch padrão do repo
          DEFAULT_BRANCH="$(git ls-remote --symref "$SRC" HEAD | awk '/^ref:/{print $2}' | sed 's#refs/heads/##')"
          echo "::notice::Branch padrão do repositório: ${DEFAULT_BRANCH}"
          git clone --depth=1 -b "$DEFAULT_BRANCH" "$SRC" device_kernel

          echo "KERNEL_TREE=$(pwd)/device_kernel" >> $GITHUB_ENV

      # ---------------------------------------------------------
      # KernelSU — injeta de forma idempotente
      # ---------------------------------------------------------
      - name: Injetar KernelSU no tree do kernel
        run: |
          set -euxo pipefail
          cd "$KERNEL_TREE"

          KS_DIR="drivers/kernelsu"
          # limpa qualquer arquivo/dir existente
          rm -rf "$KS_DIR"
          mkdir -p "$KS_DIR"

          git clone --depth=1 -b "${KERNELSU_BRANCH}" "${KERNELSU_SOURCE}" /tmp/KernelSU
          cp -av /tmp/KernelSU/kernel/* "$KS_DIR"/

          # inclui no Kconfig/Makefile principais (evita duplicação)
          grep -q 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig || \
            echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig

          grep -q 'obj-$(CONFIG_KSU)      += kernelsu/' drivers/Makefile || \
            echo 'obj-$(CONFIG_KSU)      += kernelsu/' >> drivers/Makefile

      - name: Sanear Makefiles/Config (CRLF/BOM/TAB)
        run: |
          set -euxo pipefail
          cd "$KERNEL_TREE"
          find . -type f \( -name "Makefile" -o -name "Kconfig" -o -name "*.mk" -o -name "*.cfg" \) -print0 \
            | xargs -0 sed -i 's/\r$//'

      # Hotfix opcional: binder_gki.c (millet) – troca include angulado por include com aspas
      - name: Hotfix:binder_gki.c include path (millet)
        run: |
          set -euxo pipefail
          cd "$KERNEL_TREE"
          FILE="drivers/mihw/millet/binder_gki.c"
          if [ -f "$FILE" ]; then
            echo "::notice::Aplicando hotfix no $FILE"
            sed -i 's|#include <\(\.\./\.\./android/binder_internal\.h\)>|#include "\1"|' "$FILE" || true
            sed -i 's|#include <android/binder_internal\.h>|#include "android/binder_internal.h"|' "$FILE" || true
          fi

      - name: Compilar Kernel (defconfig + build)
        run: |
          set -euxo pipefail
          cd "$KERNEL_TREE"

          echo "Usando defconfig: ${DEFCONFIG_NAME}"
          export ARCH=arm64
          export SUBARCH=arm64

          make -j"$(nproc)" "${DEFCONFIG_NAME}"

          make -j"$(nproc)" \
            ${LLVM:+LLVM=1} \
            ${LLVM_IAS:+LLVM_IAS=1} \
            ${LD:+LD=$LD} \
            ${CROSS_COMPILE:+CROSS_COMPILE=$CROSS_COMPILE} \
            ${CROSS_COMPILE_ARM32:+CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32}

          mkdir -p "$GITHUB_WORKSPACE/out"
          for f in \
            arch/arm64/boot/Image.gz-dtb \
            arch/arm64/boot/Image.gz \
            arch/arm64/boot/Image \
            out/arch/arm64/boot/Image.gz-dtb \
            out/arch/arm64/boot/Image.gz \
            out/arch/arm64/boot/Image; do
            [ -f "$f" ] && cp -av "$f" "$GITHUB_WORKSPACE/out/" || true
          done

      - name: Empacotar com AnyKernel3
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE"
          rm -rf AnyKernel3
          git clone --depth=1 "${AK3_SOURCE}" -b "${AK3_BRANCH}" AnyKernel3
          cp -av out/* AnyKernel3/ || true
          cd AnyKernel3
          zip -r9 "$GITHUB_WORKSPACE/Kernel-star_hyper_a14-$(date +%Y%m%d-%H%M).zip" ./

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-star_hyper_a14
          path: |
            out/**
            *.zip
