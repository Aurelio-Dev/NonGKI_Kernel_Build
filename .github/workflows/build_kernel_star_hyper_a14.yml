name: Build kernel (star / HyperOS A14)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # ---- fontes e parâmetros principais ----
      KERNEL_SOURCE: https://github.com/EndCredits/android_kernel_xiaomi_sm8350-miui.git
      KERNEL_BRANCH: hyper-14
      DEFCONFIG_NAME: vendor/star_defconfig

      KERNELSU_SOURCE: https://github.com/tiann/KernelSU.git
      KERNELSU_BRANCH: main

      AK3_SOURCE: https://github.com/osm0sis/AnyKernel3.git
      AK3_BRANCH: master

      KERNEL_DIR: ${{ github.workspace }}/kernel-src
      OUT_DIR: ${{ github.workspace }}/kernel-src/out

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update -yq
          sudo apt-get install -yqq bc bison flex libssl-dev build-essential \
                                   ccache libelf-dev libncurses-dev rsync \
                                   clang lld llvm zip

      - name: Enable 8G swap (estabiliza RAM)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euxo pipefail
          sudo swapoff -a || true
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          swapon --show || true
          free -h || true

      - name: Fetch kernel source
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth=1 --branch "${KERNEL_BRANCH}" "${KERNEL_SOURCE}" "${KERNEL_DIR}"

      - name: Clean source tree (mrproper + fresh out)
        shell: bash
        run: |
          set -euxo pipefail
          cd "$KERNEL_DIR"
          
          export LC_ALL=C
          export LANG=C
          rm -f .config || true
          rm -rf include/config arch/arm64/include/generated || true
          git reset --hard HEAD || true
          # Preserva drivers/kernelsu se já existir (acelera iteração)
          git clean -fdx -e drivers/kernelsu -e drivers/kernelsu/** || true
          make ARCH=arm64 mrproper || true
          rm -rf "$OUT_DIR"
          mkdir -p "$OUT_DIR"

      - name: Ensure KernelSU present (after clean)
        shell: bash
        run: |
          set -euxo pipefail
          cd "$KERNEL_DIR"

          rm -rf drivers/kernelsu drivers/KernelSU .kernelsu_tmp || true
          git clone --depth=1 --branch "${KERNELSU_BRANCH}" "${KERNELSU_SOURCE}" .kernelsu_tmp

          src_dir=""
          for cand in ".kernelsu_tmp/kernel" ".kernelsu_tmp/KernelSU/kernel" ".kernelsu_tmp"; do
            [ -f "$cand/Kconfig" ] && src_dir="$cand" && break
          done
          [ -n "$src_dir" ] || { echo "::error::Kconfig do KernelSU não encontrado"; exit 5; }

          mkdir -p drivers/kernelsu
          rsync -a --delete "$src_dir"/ drivers/kernelsu/

          # compat Kbuild->Makefile quando necessário
          if [ ! -f drivers/kernelsu/Makefile ] && [ -f drivers/kernelsu/Kbuild ]; then
            printf 'include $(src)/Kbuild\n' > drivers/kernelsu/Makefile
          fi

          # garantir referência em drivers/
          grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig || echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
          grep -qE 'obj-(y|m).*=.*kernelsu/?' drivers/Makefile || echo 'obj-y += kernelsu/' >> drivers/Makefile

      - name: Neutralizar glue de SELinux do KernelSU (preserva headers)
        shell: bash
        run: |
          set -euxo pipefail
          cd "$KERNEL_DIR"

          # Se não houver KernelSU, não faz nada
          [ -d drivers/kernelsu ] || exit 0

          # 1) NÃO apague drivers/kernelsu/selinux !!
          # Precisamos manter os headers (selinux/selinux.h) que o allowlist.c inclui.

          # 2) Desabilite a compilação do subdir selinux/ apenas comentando as referências
          #    no Makefile/Kconfig do KernelSU (idempotente).
          if [ -f drivers/kernelsu/Makefile ]; then
            sed -ri 's@(^[[:space:]]*obj-[^=]*\+=.*\bselinux/.*$)@# \0@g' drivers/kernelsu/Makefile || true
            # Se existir linha adicionando diretamente allowlist.o, vamos condicionar ao SELinux
            # somente se os headers não existirem (feito no passo 4 abaixo).
          fi

          if [ -f drivers/kernelsu/Kconfig ]; then
            sed -ri 's@(^[[:space:]]*source[[:space:]]*"drivers/kernelsu/selinux/Kconfig".*$)@# \0@g' drivers/kernelsu/Kconfig || true
          fi

          # 3) Garanta que o próprio diretório do KernelSU esteja no include path
          #    (normalmente já está, mas não custa assegurar)
          if [ -f drivers/kernelsu/Makefile ] && ! grep -q 'ccflags-y.*-I\$(src)' drivers/kernelsu/Makefile; then
            echo 'ccflags-y += -I$(src)' >> drivers/kernelsu/Makefile
          fi

          # 4) Se POR ALGUMA RAZÃO os headers não estiverem presentes,
          #    remova allowlist.o do build (para não quebrar).
          if [ ! -f drivers/kernelsu/selinux/selinux.h ]; then
            sed -ri 's@(^[[:space:]]*obj-[^=]*\+=.*\ballowlist\.o\b.*$)@# \0@g' drivers/kernelsu/Makefile || true
          fi


      - name: Patch KernelSU for SELinux headers
        shell: bash
        run: |
          set -euxo pipefail
          cd "$KERNEL_DIR"
          KS_MK=""
          for p in drivers/kernelsu/Makefile drivers/KernelSU/Makefile; do
            if [ -f "$p" ]; then KS_MK="$p"; break; fi
          done
          [ -n "$KS_MK" ] || exit 0
          if ! grep -q 'selinux/include' "$KS_MK"; then
            cat >> "$KS_MK" <<'EOF'

          # ---- CI patch: ensure SELinux headers are visible when building KernelSU ----
          ccflags-$(CONFIG_SECURITY_SELINUX) += -Isecurity/selinux/include
          # -----------------------------------------------------------------------------
          EOF
          fi

      - name: Guard NR_ZSPAGES in taskstats.c (robusto)
        shell: bash
        run: |
          set -euxo pipefail
          cd "$KERNEL_DIR"
          f="kernel/taskstats.c"
          if grep -q 'zone_page_state *(.*NR_ZSPAGES)' "$f" && \
             ! awk 'f&&/#endif/{exit} /NR_ZSPAGES/&&/zone_page_state/{f=1} END{exit !f}' "$f"; then
            perl -0777 -pe 's/(\n[[:space:]]*zspages[[:space:]]*\+=[[:space:]]*zone_page_state[[:space:]]*\([[:space:]]*zone[[:space:]]*,[[:space:]]*NR_ZSPAGES[[:space:]]*\)[[:space:]]*;[[:space:]]*\n)/\n#ifdef CONFIG_ZSMALLOC\1#endif\n/s' -i "$f"
            echo "→ Guard NR_ZSPAGES aplicado"
          else
            echo "→ Guard já presente ou linha não encontrada"
          fi

      - name: Pin clang pré-AOSP (somente se necessário)
        shell: bash
        run: |
          set -euxo pipefail
          cd "$KERNEL_DIR"
          # Baixa clang-r487747c (clang 14) se ainda não existir:
          if [ ! -d "$HOME/aosp-clang" ]; then
            url="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master/clang-r487747c.tar.gz"
            mkdir -p "$HOME/aosp-clang"
            curl -Ls "$url" | tar -xz -C "$HOME/aosp-clang"
          fi
          echo "$HOME/aosp-clang/bin" >> $GITHUB_PATH

      - name: Configurar e compilar (robusto)
        shell: bash
        run: |
          set -euxo pipefail
          cd "$KERNEL_DIR"
      
          export OUT_DIR="${OUT_DIR:-$KERNEL_DIR/out}"
          export KBUILD_OUTPUT="$OUT_DIR"
          export KCONFIG_CONFIG="$OUT_DIR/.config"
      
          # ---------- Toolchain: fixar clang AOSP (compatível com trees antigas) ----------
          # Usa clang-r487747c (clang 14) do AOSP se não houver um "Android clang" no PATH
          if ! clang --version 2>/dev/null | grep -qi 'Android' ; then
            if [ ! -d "$HOME/aosp-clang" ]; then
              url="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master/clang-r487747c.tar.gz"
              mkdir -p "$HOME/aosp-clang"
              curl -Ls "$url" | tar -xz -C "$HOME/aosp-clang"
            fi
            export PATH="$HOME/aosp-clang/bin:$PATH"
          fi
      
          # Forçar alvo ARM64 e ferramentas LLVM para TODAS as fases (inclui prepare/bounds.c)
          export ARCH=arm64
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
          export LLVM=1
          export LLVM_IAS=1
          export CC=clang
          export CXX=clang++
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip
          export HOSTCC=clang
          export HOSTCXX=clang++
          export HOSTLD=ld.lld
      
          echo "=== clang em uso ==="
          clang --version || true
          which clang || true
          echo "CROSS_COMPILE=$CROSS_COMPILE  CLANG_TRIPLE=$CLANG_TRIPLE"
      
          # ----------------------------- sanity -----------------------------
          [ -f drivers/kernelsu/Kconfig ] || { echo "::error::drivers/kernelsu/Kconfig ausente"; exit 6; }
          grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig || { echo "::error::drivers/Kconfig não referencia drivers/kernelsu/Kconfig"; exit 7; }
      
          # Resolver defconfig
          rm -f .config || true
          rm -rf include/config arch/arm64/include/generated || true
          want="${DEFCONFIG_NAME}"
          base="${want##*/}"
          found=""
          if [ -f "arch/arm64/configs/${want}" ]; then
            found="$want"
          elif cand=$(ls arch/arm64/configs/**/"$base" 2>/dev/null | head -n1 || true); then
            found="${cand#arch/arm64/configs/}"
          fi
          [ -n "$found" ] || { echo "::error::Defconfig '${want}' não encontrado"; exit 2; }
          echo "→ Usando defconfig: $found"
      
          # zerar OUT_DIR antes do .config
          rm -rf "$OUT_DIR"
          mkdir -p "$OUT_DIR"
      
          # Gerar .config
          make LOCALVERSION= O="$OUT_DIR" "$found" V=1 | tee  build.log
          make LOCALVERSION= O="$OUT_DIR" olddefconfig   | tee -a build.log
      
          # Ajustes / overrides
          chmod +x ./scripts/config
          ./scripts/config --file "$OUT_DIR/.config" -e CONFIG_COMPAT_VDSO || true
          ./scripts/config --file "$OUT_DIR/.config" -d CONFIG_SHADOW_CALL_STACK || true
          ./scripts/config --file "$OUT_DIR/.config" -e CONFIG_LTO_NONE -d CONFIG_LTO_CLANG || true
          ./scripts/config --file "$OUT_DIR/.config" -d CONFIG_RELR || true
          ./scripts/config --file "$OUT_DIR/.config" -e CONFIG_INIT_STACK_NONE -d CONFIG_INIT_STACK_ALL_PATTERN -d CONFIG_INIT_STACK_ALL_ZERO || true
          ./scripts/config --file "$OUT_DIR/.config" -e CONFIG_INIT_ON_ALLOC_DEFAULT_ON -d CONFIG_INIT_ON_FREE_DEFAULT_ON || true
          ./scripts/config --file "$OUT_DIR/.config" -e CONFIG_ZRAM || true
          ./scripts/config --file "$OUT_DIR/.config" -e CONFIG_ZSMALLOC || true
          # KSU / SuSFS se existirem
          if grep -qE '^[[:space:]]*config[[:space:]]+KSU\>' drivers/kernelsu/Kconfig 2>/dev/null; then
            ./scripts/config --file "$OUT_DIR/.config" -e CONFIG_KSU || true
          elif grep -qE '^[[:space:]]*config[[:space:]]+KERNELSU\>' drivers/kernelsu/Kconfig 2>/dev/null; then
            ./scripts/config --file "$OUT_DIR/.config" -e CONFIG_KERNELSU || true
          fi
          for sym in SUSFS SUSFS_CORE SUSFS_NEXT SUSFS_SUPPORT; do
            grep -RIlq "^[[:space:]]*config[[:space:]]+$sym\>" -- drivers arch fs kernel mm 2>/dev/null && \
              ./scripts/config --file "$OUT_DIR/.config" -e "CONFIG_${sym}" || true
          done
      
          # não derrubar por warnings (Werror off)
          ./scripts/config --file "$OUT_DIR/.config" -d CONFIG_CC_WERROR || true
          ./scripts/config --file "$OUT_DIR/.config" -d CONFIG_WERROR    || true
      
          # encurtar/selar versão
          ./scripts/config --file "$OUT_DIR/.config" --set-str CONFIG_LOCALVERSION "-star"
          ./scripts/config --file "$OUT_DIR/.config" -d CONFIG_LOCALVERSION_AUTO
      
          # reduzir peso da build
          ./scripts/config --file "$OUT_DIR/.config" \
            -d CONFIG_DEBUG_INFO -d CONFIG_DEBUG_INFO_DWARF4 -d CONFIG_DEBUG_INFO_BTF \
            -d CONFIG_GCOV_KERNEL || true
      
          # selar sem prompts
          make LOCALVERSION= O="$OUT_DIR" olddefconfig | tee -a build.log
          make LOCALVERSION= O="$OUT_DIR" syncconfig   | tee -a build.log
      
          # preparar com o alvo correto (gera bounds/timeconst já no target)
          make O="$OUT_DIR" V=1 prepare | tee -a build.log
      
          # validar UTS_RELEASE <= 64
          if [ -f "$OUT_DIR/include/generated/utsrelease.h" ]; then
            rel=$(grep -oP '(?<=^#define UTS_RELEASE ").*(?="$)' "$OUT_DIR/include/generated/utsrelease.h" || true)
            len=$(printf "%s" "$rel" | wc -c)
            echo "UTS_RELEASE='$rel' (len=$len)"
            [ "$len" -le 64 ] || { echo "::error::UTS_RELEASE > 64 chars"; exit 9; }
          fi
      
          # build final
          set +e
          make LOCALVERSION= -j8 \
               O="$OUT_DIR" \
               V=1 \
               KCFLAGS='-Wno-error' KBUILD_CFLAGS='-Wno-error' \
               HOSTCFLAGS='-Wno-error -Wno-unused-function -Wno-unused-variable -Wno-gnu-variable-sized-type-not-at-end -Wno-address-of-packed-member -Wno-incompatible-function-pointer-types' \
               HOSTCXXFLAGS='-Wno-error' \
               2>&1 | tee -a build.log
          rc=${PIPESTATUS[0]}
          set -e
      
          # (extra) se falhar, despeja contexto do bounds.s pra debug rápido
          if [ "$rc" -ne 0 ]; then
            echo "=== Contexto do bounds.s (±120 linhas) ===" || true
            line=$(grep -n 'kernel/bounds\.s' build.log | head -n1 | cut -d: -f1 || true)
            if [ -n "$line" ]; then
              start=$(( line>120 ? line-120 : 1 ))
              sed -n "${start},$((line+120))p" build.log || true
            fi
          fi
      
          exit $rc

      - name: Empacotar com AnyKernel3 (robusto)
        if: success()
        shell: bash
        run: |
          set -euxo pipefail
          cd "$KERNEL_DIR"
          IMG="$OUT_DIR/arch/arm64/boot/Image.gz-dtb"
          [ -f "$IMG" ] || { echo "::error::Image.gz-dtb não encontrado"; exit 7; }
          sig=$(head -c2 "$IMG" | hexdump -v -e '1/1 "%02X"')
          [ "$sig" = "1F8B" ] || { echo "::error::Arquivo não é gzip (esperado Image.gz-dtb)"; exit 7; }

          rm -rf AnyKernel3
          git clone --depth=1 --branch "${AK3_BRANCH}" "${AK3_SOURCE}" AnyKernel3

          sed -ri 's@^(block=).*@\1boot@' AnyKernel3/anykernel.sh
          sed -ri 's@^(is_slot_device=).*@\11@' AnyKernel3/anykernel.sh
          grep -q '^device.name1=star' AnyKernel3/anykernel.sh || echo 'device.name1=star' >> AnyKernel3/anykernel.sh

          cp -a "$IMG" AnyKernel3/
          cd AnyKernel3
          zip -r9 ../kernel-star.zip ./*

      - name: Diagnóstico de falha (se houver)
        if: failure()
        shell: bash
        run: |
          set -euxo pipefail
          cd "$KERNEL_DIR"
          echo "=== HEAD do log (300) ==="; head -n 300 build.log || true
          echo "=== TAIL do log (500) ==="; tail -n 500 build.log || true
          echo "=== Erros encontrados (±3) ==="
          grep -nEi -C3 '(^|[[:space:]])(error:|fatal error:|undefined reference|No rule to make target|No such file|make:[[:space:]]\*{3}|collect2:[[:space:]]error|ld\.lld:[[:space:]]error|clang:[[:space:]]error|Killed|Segmentation fault|Error[[:space:]][0-9]+)' build.log || true
          echo "=== Primeiro erro com contexto (±40) ==="
          first=$(grep -nEi '(error:|fatal error:|undefined reference|ld\.lld:[[:space:]]error|clang:[[:space:]]error|No rule to make target|No such file)' build.log | head -n1 | cut -d: -f1 || true)
          if [ -n "$first" ]; then
            start=$(( first>40 ? first-40 : 1 ))
            sed -n "${start},$((first+40))p" build.log || true
          else
            echo "Nenhum erro textual encontrado; provavelmente Werror/retcode paralelo (já mitigado)."
          fi

      - name: Upload de artefatos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-e-saidas
          path: |
            ${{ env.KERNEL_DIR }}/build.log
            ${{ env.OUT_DIR }}/.config
            ${{ env.KERNEL_DIR }}/kernel-star.zip
