name: Build Kernel • Star Hyper A14 (KernelSU)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      KERNEL_DIR: kernel-src
      OUT_DIR: kernel-src/out
      ANYKERNEL_DIR: AnyKernel3
      ARCH: arm64
      SUBARCH: arm64
      # ajuste para o seu defconfig; se não existir, cai no gki_defconfig
      DEFCONFIG: vendor/star_hyper_a14_defconfig

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Dependências
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache clang-14 lld-14 llvm-14 flex git \
            libssl-dev libelf-dev dwarves libncurses5-dev libncursesw5-dev \
            python3 zip unzip rsync cmake pkg-config libyaml-dev

          # Exporta ferramentas (sem mexer no update-alternatives)
          echo "LLVM=1"              >> "$GITHUB_ENV"
          echo "CC=clang-14"         >> "$GITHUB_ENV"
          echo "HOSTCC=clang-14"     >> "$GITHUB_ENV"
          echo "LD=ld.lld-14"        >> "$GITHUB_ENV"
          echo "AR=llvm-ar-14"       >> "$GITHUB_ENV"
          echo "NM=llvm-nm-14"       >> "$GITHUB_ENV"
          echo "OBJCOPY=llvm-objcopy-14" >> "$GITHUB_ENV"
          echo "OBJDUMP=llvm-objdump-14" >> "$GITHUB_ENV"
          echo "STRIP=llvm-strip-14" >> "$GITHUB_ENV"

      # === Clone da fonte do kernel (exemplo robusto; troque pela sua origem se quiser) ===
      - name: Clonar fonte do Kernel (robusto a branch ausente)
        run: |
          set -euxo pipefail
          if [ ! -d "${KERNEL_DIR}" ]; then
            # Troque pela sua origem de kernel se necessário
            git clone --depth=1 https://github.com/arter97/android_kernel_common ${KERNEL_DIR} || true
          fi
          cd "${KERNEL_DIR}"
          git rev-parse --is-inside-work-tree

      # === Injeção real do KernelSU (código + headers) ===
      - name: Injetar KernelSU (drivers/kernelsu + headers)
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -euxo pipefail

          rm -rf ../_ksu_tmp
          git clone --depth=1 https://github.com/tiann/KernelSU ../_ksu_tmp

          # Copia código
          mkdir -p drivers
          rsync -a ../_ksu_tmp/kernel/drivers/kernelsu/ drivers/kernelsu/

          # Copia headers (ksu*.h)
          rsync -a --include="ksu*.h" --include="*/" --exclude="*" \
            ../_ksu_tmp/kernel/include/linux/ include/linux/

          rm -rf ../_ksu_tmp

          # Garante include no Kconfig
          if ! grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig; then
            sed -i '/endmenu/i\source "drivers\/kernelsu\/Kconfig"' drivers/Kconfig
          fi

          # Garante entrada no Makefile
          if ! grep -q 'kernelsu/' drivers/Makefile; then
            echo 'obj-$(CONFIG_KERNELSU) += kernelsu/' >> drivers/Makefile
          fi

      - name: Preparar OUT
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -euxo pipefail
          rm -rf "${OUT_DIR}"
          mkdir -p "${OUT_DIR}"

      # === Defconfig não-interativo ===
      - name: Gerar .config (não-interativo)
        working-directory: ${{ env.KERNEL_DIR }}
        env:
          ARCH: ${{ env.ARCH }}
          SUBARCH: ${{ env.SUBARCH }}
        run: |
          set -euxo pipefail

          if ! [ -f "arch/arm64/configs/${DEFCONFIG}" ]; then
            echo "Warning: ${DEFCONFIG} não encontrado; usando gki_defconfig"
            make O="${OUT_DIR}" ARCH=${ARCH} SUBARCH=${SUBARCH} \
                 LLVM=$LLVM CC="$CC" HOSTCC="$HOSTCC" gki_defconfig
          else
            make O="${OUT_DIR}" ARCH=${ARCH} SUBARCH=${SUBARCH} \
                 LLVM=$LLVM CC="$CC" HOSTCC="$HOSTCC" "${DEFCONFIG}"
          fi

          # Força opções chave
          "${PWD}/scripts/config" --file "${OUT_DIR}/.config" --enable  KERNELSU || true
          "${PWD}/scripts/config" --file "${OUT_DIR}/.config" --disable LTO_CLANG || true
          "${PWD}/scripts/config" --file "${OUT_DIR}/.config" --disable THINLTO   || true
          "${PWD}/scripts/config" --file "${OUT_DIR}/.config" --enable  LTO_NONE  || true

          # Resolve novas opções sem interação (evita Broken pipe com pipefail)
          set +o pipefail
          yes "" | make O="${OUT_DIR}" ARCH=${ARCH} SUBARCH=${SUBARCH} \
                 LLVM=$LLVM CC="$CC" HOSTCC="$HOSTCC" olddefconfig | tee -a "${OUT_DIR}/_olddefconfig.log"
          set -o pipefail

      # === Compilar ===
      - name: Compilar Kernel (olddefconfig + build, com log)
        working-directory: ${{ env.KERNEL_DIR }}
        env:
          ARCH: ${{ env.ARCH }}
          SUBARCH: ${{ env.SUBARCH }}
        run: |
          set -euxo pipefail
          export KCFLAGS="-Wno-error"
          make -j"$(nproc)" O="${OUT_DIR}" ARCH=${ARCH} SUBARCH=${SUBARCH} \
               LLVM=$LLVM CC="$CC" HOSTCC="$HOSTCC" \
               LD="$LD" AR="$AR" NM="$NM" OBJCOPY="$OBJCOPY" OBJDUMP="$OBJDUMP" STRIP="$STRIP" \
               Image.gz-dtb 2>&1 | tee "${OUT_DIR}/build.log"

      # === Empacotar (opcional) ===
      - name: Empacotar com AnyKernel3
        if: ${{ always() }}
        run: |
          set -euxo pipefail
          if [ -d "${ANYKERNEL_DIR}" ] && [ -f "${{ env.OUT_DIR }}/arch/arm64/boot/Image.gz-dtb" ]; then
            cp -f "${{ env.OUT_DIR }}/arch/arm64/boot/Image.gz-dtb" "${ANYKERNEL_DIR}/Image.gz-dtb"
            cd "${ANYKERNEL_DIR}"
            zip -r9 ../debug-kernel-ksu.zip ./*
          else
            echo "AnyKernel3 ausente ou Image.gz-dtb não gerada; pulando empacote."
          fi

      - name: Publicar artefatos
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: debug-kernel-logs
          path: |
            ${{ env.KERNEL_DIR }}/out/build.log
            ${{ env.KERNEL_DIR }}/out/_olddefconfig.log
            debug-kernel-ksu.zip
          if-no-files-found: warn
