name: Build Kernel • star_hyper_a14

on:
  workflow_dispatch:
    inputs:
      KERNEL_SOURCE:
        description: "URL do repositório do kernel (git clone)"
        required: true
        default: "https://github.com/seu-usuario/seu-kernel.git"
      KERNEL_REF:
        description: "Branch/Tag/Commit do kernel (opcional)"
        required: false
        default: ""
      DEFCONFIG_NAME:
        description: "Defconfig desejado (ex.: vendor/star_hyper_a14_defconfig)"
        required: true
        default: "vendor/star_hyper_a14_defconfig"

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      KERNEL_DIR: ${{ github.workspace }}/kernel-src
      DEFCONFIG_NAME: ${{ github.event.inputs.DEFCONFIG_NAME }}
      KERNEL_SOURCE: ${{ github.event.inputs.KERNEL_SOURCE }}
      KERNEL_REF: ${{ github.event.inputs.KERNEL_REF }}

    steps:
      # ────────────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ────────────────────────────────────────────────────────────────────
      - name: Dependências
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates ccache curl flex \
            git gperf libncurses-dev libssl-dev python3 unzip xz-utils \
            clang lld llvm

      # ────────────────────────────────────────────────────────────────────
      # NOVO: clonar a árvore do kernel e validar 'arch/arm64/configs'
      - name: Clonar kernel (robusto)
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf "$KERNEL_DIR"
          if [[ -n "${KERNEL_REF}" ]]; then
            echo "→ Clonando ${KERNEL_SOURCE} na ref ${KERNEL_REF}"
            git clone --depth 1 --branch "${KERNEL_REF}" "${KERNEL_SOURCE}" "$KERNEL_DIR"
          else
            echo "→ Detectando branch padrão de ${KERNEL_SOURCE}"
            default_branch="$(git ls-remote --symref "${KERNEL_SOURCE}" HEAD | awk '/^ref:/ {print $2}' | sed 's#refs/heads/##')"
            echo "→ Usando branch padrão: ${default_branch}"
            git clone --depth 1 --branch "${default_branch}" "${KERNEL_SOURCE}" "$KERNEL_DIR"
          fi

          # Sanidade: a árvore precisa ser arm64 e ter os defconfigs
          test -d "$KERNEL_DIR/arch/arm64/configs" || {
            echo "::error::A árvore clonada não contém 'arch/arm64/configs'. Verifique KERNEL_SOURCE/KERNEL_REF."
            echo "Conteúdo do topo da árvore:"
            ls -la "$KERNEL_DIR" | sed 's#^#  #'
            exit 2
          }

      # ────────────────────────────────────────────────────────────────────
      - name: Preparar árvore de build
        run: |
          set -euxo pipefail
          mkdir -p "$KERNEL_DIR/out"
          cd "$KERNEL_DIR"
          # Limpa vestígios de configs antigos no source tree
          rm -rf include/config include/generated \
                 arch/arm64/include/generated .config .config.old || true

      # ────────────────────────────────────────────────────────────────────
      - name: Resolver defconfig (robusto)
        id: defcfg
        shell: bash
        run: |
          set -euo pipefail
          cd "$KERNEL_DIR"

          want="${DEFCONFIG_NAME:-}"
          found=""
          archdir="arch/arm64/configs"

          # 1) exatamente o pedido
          if [[ -n "$want" && -f "$archdir/$want" ]]; then
            found="$want"
          fi

          # 2) mesmo basename em qualquer subpasta
          if [[ -z "$found" && -n "$want" ]]; then
            base="${want##*/}"
            cand="$(ls "$archdir"/**/"$base" 2>/dev/null | head -n1 || true)"
            [[ -n "$cand" ]] && found="${cand#${archdir}/}"
          fi

          # 3) algum vendor/*_defconfig
          if [[ -z "$found" ]]; then
            cand="$(ls "$archdir"/vendor/*_defconfig 2>/dev/null | head -n1 || true)"
            [[ -n "$cand" ]] && found="${cand#${archdir}/}"
          fi

          # 4) qualquer *_defconfig
          if [[ -z "$found" ]]; then
            cand="$(ls "$archdir"/*_defconfig 2>/dev/null | head -n1 || true)"
            [[ -n "$cand" ]] && found="${cand#${archdir}/}"
          fi

          if [[ -z "$found" ]]; then
            echo "::error::Nenhum defconfig encontrado. Amostra:"
            find "$archdir" -maxdepth 2 -name "*defconfig" | sed 's#^#  - #'
            exit 2
          fi

          echo "→ Defconfig resolvido: $found"
          echo "DEFCONFIG_RESOLVED=$found" >> "$GITHUB_ENV"

      # ────────────────────────────────────────────────────────────────────
      - name: Gerar .config (não-interativo)
        shell: bash
        run: |
          set -euo pipefail
          cd "$KERNEL_DIR"
          : "${DEFCONFIG_RESOLVED:?DEFCONFIG_RESOLVED não definido}"

          echo "→ Usando defconfig: ${DEFCONFIG_RESOLVED}"
          make O=out ARCH=arm64 "${DEFCONFIG_RESOLVED}" V=1

          # Consolida opções novas com padrão, sem interatividade
          make O=out ARCH=arm64 olddefconfig

      # ────────────────────────────────────────────────────────────────────
      - name: Compilar Kernel (robusto, sem prompts)
        shell: bash
        run: |
          set -euo pipefail
          cd "$KERNEL_DIR"

          set +e
          make -j"$(nproc)" \
               O=out ARCH=arm64 LLVM=1 CC=clang LD=ld.lld \
               AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy \
               OBJDUMP=llvm-objdump STRIP=llvm-strip V=1 \
               2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          set -e

          if [[ $rc -ne 0 ]]; then
            echo "::error::Falha na compilação. Veja build.log"
            exit $rc
          fi

          ls -la out/arch/arm64/boot || true

      # ────────────────────────────────────────────────────────────────────
      - name: Diagnóstico de falha (se houver)
        if: failure()
        shell: bash
        run: |
          set -euxo pipefail
          cd "$KERNEL_DIR"
          echo "=== HEAD do log (200) ===" ; head -n 200 build.log || true
          echo "=== TAIL do log (200) ===" ; tail -n 200 build.log || true
          echo "=== .config (primeiras 160 linhas) ==="
          test -f out/.config && sed -n '1,160p' out/.config || true

      # ────────────────────────────────────────────────────────────────────
      - name: Upload de logs e .config
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-kernel-logs
          path: |
            ${{ env.KERNEL_DIR }}/build.log
            ${{ env.KERNEL_DIR }}/out/.config
