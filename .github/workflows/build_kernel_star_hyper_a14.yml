name: Build kernel (star / HyperOS A14)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KERNEL_SOURCE: https://github.com/EndCredits/android_kernel_xiaomi_sm8350-miui.git
      KERNEL_BRANCH: hyper-14
      DEFCONFIG_NAME: vendor/star_defconfig

      # AnyKernel3 (opcional – empacotamento)
      AK3_SOURCE: https://github.com/osm0sis/AnyKernel3.git
      AK3_BRANCH: master

      # KernelSU (reinjeção automática)
      KERNELSU_SOURCE: https://github.com/tiann/KernelSU.git
      KERNELSU_BRANCH: main

      KERNEL_DIR: ${{ github.workspace }}/kernel-src

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update -yq
          sudo apt-get install -yqq bc bison flex libssl-dev build-essential \
                                  ccache libelf-dev libncurses-dev rsync clang lld llvm

      - name: Fetch kernel source
        run: |
          set -euxo pipefail
          git clone --depth=1 --branch "${KERNEL_BRANCH}" "${KERNEL_SOURCE}" "${KERNEL_DIR}"

      - name: Clean source tree (mrproper + fresh out)
        shell: bash
        run: |
          set -euxo pipefail
          cd "$KERNEL_DIR"
          # Limpa sujeira na RAIZ da árvore
          rm -f .config || true
          rm -rf include/config arch/arm64/include/generated || true
          git reset --hard HEAD || true
          # Preserva drivers/kernelsu para evitar reinjeções lentas (se existir)
          git clean -fdx -e drivers/kernelsu -e drivers/kernelsu/** || true
          make ARCH=arm64 mrproper || true
          # Recria diretório de build e fixa out-of-tree
          rm -rf out
          mkdir -p out
          export KBUILD_OUTPUT=out

      - name: Injetar/normalizar KernelSU em drivers/kernelsu (layout-agnóstico)
        shell: bash
        run: |
          set -euxo pipefail
          cd "$KERNEL_DIR"
      
          rm -rf drivers/kernelsu drivers/KernelSU .kernelsu_tmp || true
          git clone --depth=1 --branch "${KERNELSU_BRANCH:-main}" "${KERNELSU_SOURCE:-https://github.com/tiann/KernelSU.git}" .kernelsu_tmp
      
          # Detecta onde está o Kconfig do KernelSU
          src_dir=""
          for cand in ".kernelsu_tmp/kernel" ".kernelsu_tmp/KernelSU/kernel" ".kernelsu_tmp"; do
            if [ -f "$cand/Kconfig" ]; then
              src_dir="$cand"
              break
            fi
          done
          if [ -z "$src_dir" ]; then
            echo "::error::Nenhum Kconfig encontrado no repositório do KernelSU"; ls -la .kernelsu_tmp; find .kernelsu_tmp -maxdepth 3 -name Kconfig || true
            exit 5
          fi
      
          # Copia para drivers/kernelsu/
          mkdir -p drivers/kernelsu
          rsync -a --delete "$src_dir"/ drivers/kernelsu/
      
          # Se vier só Kbuild, cria Makefile compatível
          if [ ! -f drivers/kernelsu/Makefile ] && [ -f drivers/kernelsu/Kbuild ]; then
            printf 'include $(src)/Kbuild\n' > drivers/kernelsu/Makefile
          fi
      
          # Sincroniza referências em drivers/ (Makefile e Kconfig)
          grep -q 'obj-y[[:space:]]\+\+=\s*kernelsu/' drivers/Makefile 2>/dev/null || echo 'obj-y += kernelsu/' >> drivers/Makefile
          grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig 2>/dev/null || echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
      
          # Debug rápido
          ls -la drivers/kernelsu | sed 's/^/KSU: /'
          grep -n 'kernelsu/Kconfig' drivers/Kconfig || true
      
      - name: Neutralizar glue de SELinux do KernelSU (robusto)
        shell: bash
        run: |
          set -euxo pipefail
          cd "$KERNEL_DIR"
      
          # Remove árvore selinux (se houver) e comenta referências
          if [ -d drivers/kernelsu/selinux ]; then
            rm -rf drivers/kernelsu/selinux
          fi
          if [ -f drivers/kernelsu/Makefile ]; then
            sed -ri 's@(^[[:space:]]*obj-[^=]*=.*selinux/.*$)@# \0@' drivers/kernelsu/Makefile || true
            sed -ri 's@(^[[:space:]]*obj-y[[:space:]]*\+=.*selinux/.*$)@# \0@' drivers/kernelsu/Makefile || true
          fi
          if [ -f drivers/kernelsu/Kconfig ]; then
            sed -ri 's@^[[:space:]]*source[[:space:]]+"drivers/kernelsu/selinux/Kconfig"@# &@' drivers/kernelsu/Kconfig || true
          fi
          # Stub vazio à prova de include acidental
          mkdir -p drivers/kernelsu/selinux
          printf 'obj-y :=\n' > drivers/kernelsu/selinux/Makefile
          printf '# disabled\n' > drivers/kernelsu/selinux/Kconfig
      
      - name: Asserts de pré-defconfig (KSU presente e referenciado)
        shell: bash
        run: |
          set -euxo pipefail
          cd "$KERNEL_DIR"
          # Arquivo precisa existir
          [ -f drivers/kernelsu/Kconfig ] || { echo "::error::drivers/kernelsu/Kconfig ausente"; exit 6; }
          # drivers/Kconfig precisa referenciar
          grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig || { echo "::error::drivers/Kconfig não referencia drivers/kernelsu/Kconfig"; exit 7; }

      # ======= ALTERAÇÃO: neutralizar glue de SELinux do KSU de forma forçada =======
      - name: Disable KernelSU SELinux glue (force)
        shell: bash
        run: |
          set -euxo pipefail
          cd "$KERNEL_DIR"

          # 1) Remova a árvore selinux do KSU (se existir)
          if [ -d drivers/kernelsu/selinux ]; then
            rm -rf drivers/kernelsu/selinux
          fi

          # 2) Comente qualquer referência a 'selinux/' no Makefile do KSU
          if [ -f drivers/kernelsu/Makefile ]; then
            sed -ri 's@(^[[:space:]]*obj-[^=]*=.*selinux/.*$)@# \0@' drivers/kernelsu/Makefile || true
            sed -ri 's@(^[[:space:]]*obj-y[[:space:]]*\+=.*selinux/.*$)@# \0@' drivers/kernelsu/Makefile || true
          fi

          # 3) Comente o "source" para Kconfig de selinux dentro do Kconfig do KSU, se existir
          if [ -f drivers/kernelsu/Kconfig ]; then
            sed -ri 's@^[[:space:]]*source[[:space:]]+"drivers/kernelsu/selinux/Kconfig"@# &@' drivers/kernelsu/Kconfig || true
          fi

          # 4) Segurança extra: stub vazio (idempotente)
          mkdir -p drivers/kernelsu/selinux
          printf 'obj-y :=\n' > drivers/kernelsu/selinux/Makefile
          printf '# disabled\n' > drivers/kernelsu/selinux/Kconfig

          echo "✓ KernelSU SELinux glue neutralizado (force)."

      - name: Guard NR_ZSPAGES in taskstats.c (robusto)
        shell: bash
        run: |
          set -euxo pipefail
          cd "$KERNEL_DIR"
          f="kernel/taskstats.c"
          if grep -q 'zone_page_state *(.*NR_ZSPAGES)' "$f" && \
             ! awk 'f&&/#endif/{exit} /NR_ZSPAGES/&&/zone_page_state/{f=1} END{exit !f}' "$f"; then
            perl -0777 -pe 's/(\n[[:space:]]*zspages[[:space:]]*\+=[[:space:]]*zone_page_state[[:space:]]*\([[:space:]]*zone[[:space:]]*,[[:space:]]*NR_ZSPAGES[[:space:]]*\)[[:space:]]*;[[:space:]]*\n)/\n#ifdef CONFIG_ZSMALLOC\1#endif\n/s' -i "$f"
            echo "→ Guard NR_ZSPAGES aplicado"
          else
            echo "→ Guard já presente ou linha não encontrada"
          fi

      - name: Configurar e compilar (robusto)
        shell: bash
        run: |
          set -euxo pipefail
          cd "$KERNEL_DIR"
          export KCONFIG_CONFIG=out/.config
          export KBUILD_OUTPUT=out

          # KSU deve existir
          if [ ! -f drivers/kernelsu/Kconfig ]; then
            echo "::error::drivers/kernelsu/Kconfig ausente antes do defconfig"; exit 6;
          fi

          # 1) Resolver defconfig
          rm -f .config || true
          rm -rf include/config arch/arm64/include/generated || true
          want="${DEFCONFIG_NAME}"
          base="${want##*/}"
          path1="arch/arm64/configs/${want}"
          found=""
          if [[ -f "$path1" ]]; then
            found="$want"
          else
            cand="$(ls arch/arm64/configs/**/"$base" 2>/dev/null | head -n1 || true)"
            [[ -n "$cand" ]] && found="${cand#arch/arm64/configs/}"
          fi
          [[ -z "$found" ]] && { echo "::error::Defconfig '${want}' não encontrado"; exit 2; }
          echo "→ Usando defconfig: $found"

          # 2) Gerar .config (não-interativo, com Clang)
          make O=out ARCH=arm64 LLVM=1 CC=clang LD=ld.lld "$found" V=1        2>&1 | tee  build.log
          make O=out ARCH=arm64 LLVM=1 CC=clang LD=ld.lld olddefconfig        2>&1 | tee -a build.log
          make O=out ARCH=arm64 LLVM=1 CC=clang LD=ld.lld syncconfig          2>&1 | tee -a build.log

          # 3) Overrides – sem 'yes'
          chmod +x ./scripts/config
          ./scripts/config --file out/.config -e CONFIG_ZRAM      || true
          ./scripts/config --file out/.config -e CONFIG_ZSMALLOC  || true
          make O=out ARCH=arm64 LLVM=1 CC=clang LD=ld.lld olddefconfig        2>&1 | tee -a build.log

          echo "→ Checando ZSMALLOC/ZRAM no .config"
          grep -E '^(CONFIG_ZSMALLOC|CONFIG_ZRAM)=' out/.config || true

          # 4) Build
          set +e
          make -j"$(nproc)" \
            O=out ARCH=arm64 LLVM=1 CC=clang LD=ld.lld \
            AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            HOSTCC=clang HOSTCXX=clang++ V=1 \
            2>&1 | tee -a build.log
          rc=${PIPESTATUS[0]}
          set -e
          exit $rc

      # (Opcional) Empacotar com AnyKernel3
      - name: Empacotar com AnyKernel3
        if: success()
        shell: bash
        run: |
          set -euxo pipefail
          cd "$KERNEL_DIR"
          img=""
          for p in out/arch/arm64/boot/Image.gz-dtb out/arch/arm64/boot/Image; do
            [ -f "$p" ] && img="$p" && break
          done
          [ -z "$img" ] && { echo "::error::Kernel image não encontrado"; exit 7; }
          rm -rf AnyKernel3
          git clone --depth=1 --branch "${AK3_BRANCH}" "${AK3_SOURCE}" AnyKernel3
          cp -a "$img" AnyKernel3/
          cd AnyKernel3
          zip -r ../kernel-star.zip ./*

      - name: Diagnóstico de falha (se houver)
        if: failure()
        run: |
          set -euxo pipefail
          cd "$KERNEL_DIR"
          export KCONFIG_CONFIG=out/.config
          echo "=== HEAD do log (200 linhas) ==="; head -n 200 build.log || true
          echo "=== TAIL do log (200 linhas) ==="; tail -n 200 build.log || true
          echo "=== Erros encontrados (contexto ±3) ==="
          grep -nEi -C3 '(^|[[:space:]])(error:|fatal error:|undefined reference|No rule to make target|No such file or directory)' build.log || true
          echo "=== .config (parcial) ==="
          test -f out/.config && sed -n '1,200p' out/.config || true

      - name: Upload de artefatos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-e-saidas
          path: |
            ${{ env.KERNEL_DIR }}/build.log
            ${{ env.KERNEL_DIR }}/out/.config
            ${{ env.KERNEL_DIR }}/kernel-star.zip
