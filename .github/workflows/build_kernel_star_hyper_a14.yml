name: Build kernel (star / HyperOS A14)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KERNEL_SOURCE: https://github.com/EndCredits/android_kernel_xiaomi_sm8350-miui.git
      KERNEL_BRANCH: hyper-14
      DEFCONFIG_NAME: vendor/star_defconfig
      AK3_SOURCE: https://github.com/osm0sis/AnyKernel3.git
      AK3_BRANCH: master
      KERNELSU_SOURCE: https://github.com/tiann/KernelSU.git
      KERNELSU_BRANCH: main
      KERNELSU_NAME: KernelSU
      ROM_TEXT: hyperos_android14
      KERNEL_DIR: ${{ github.workspace }}/kernel-src

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update -yq
          sudo apt-get install -yqq bc bison flex libssl-dev build-essential \
                                  ccache libelf-dev libncurses-dev rsync clang lld llvm

      - name: Fetch kernel source
        run: |
          set -euxo pipefail
          git clone --depth=1 --branch "${KERNEL_BRANCH}" "${KERNEL_SOURCE}" "${KERNEL_DIR}"

      - name: Clean source tree (mrproper + fresh out)
        shell: bash
        run: |
          set -euxo pipefail
          cd "$KERNEL_DIR"
          # Limpa sujeira na RAIZ da árvore
          rm -f .config || true
          rm -rf include/config arch/arm64/include/generated || true
          git reset --hard HEAD || true
          # Preserva drivers/kernelsu para evitar reinjeções lentas (se existir)
          git clean -fdx -e drivers/kernelsu -e drivers/kernelsu/** || true
          make ARCH=arm64 mrproper || true
          # Recria diretório de build e fixa out-of-tree
          rm -rf out
          mkdir -p out
          export KBUILD_OUTPUT=out

      - name: Ensure KernelSU present (after clean)
        shell: bash
        run: |
          set -euxo pipefail
          cd "$KERNEL_DIR"
          echo "→ Verificando drivers/Kconfig (deve referenciar kernelsu/Kconfig)"
          grep -nE 'kernelsu/Kconfig' drivers/Kconfig || true
      
          if [ ! -f drivers/kernelsu/Kconfig ]; then
            echo "→ (re)injetando KernelSU..."
            rm -rf drivers/kernelsu
            git clone --depth=1 --branch "${KERNELSU_BRANCH:-main}" "${KERNELSU_SOURCE:-https://github.com/tiann/KernelSU.git}" .kernelsu_tmp
            mkdir -p drivers/kernelsu
      
            # detecta onde está o Kconfig no repo do KernelSU
            src_dir=""
            for cand in ".kernelsu_tmp/kernel" ".kernelsu_tmp/KernelSU/kernel" ".kernelsu_tmp"; do
              if [ -f "$cand/Kconfig" ]; then
                src_dir="$cand"
                break
              fi
            done
      
            if [ -z "$src_dir" ]; then
              echo "::error::Nenhum Kconfig encontrado no repositório do KernelSU"
              ls -la .kernelsu_tmp || true
              find .kernelsu_tmp -maxdepth 2 -type f -name Kconfig || true
              exit 5
            fi
      
            echo "→ Copiando do subdiretório do KernelSU: $src_dir → drivers/kernelsu/"
            if command -v rsync >/dev/null 2>&1; then
              rsync -a --delete "$src_dir"/ drivers/kernelsu/
            else
              cp -a "$src_dir"/. drivers/kernelsu/
            fi
            rm -rf .kernelsu_tmp
          else
            echo "→ KernelSU já presente."
          fi
      
          # Verificação final obrigatória
          if [ ! -f drivers/kernelsu/Kconfig ]; then
            echo "::error::drivers/kernelsu/Kconfig ausente após reinjeção"
            ls -la drivers || true
            exit 5
          fi
          echo "→ Confirmado: drivers/kernelsu/Kconfig presente."


      - name: Disable KernelSU SELinux glue (robusto)
        shell: bash
        run: |
          set -euxo pipefail
          cd "$KERNEL_DIR"
          mk="drivers/kernelsu/Makefile"
          if [ -f "$mk" ]; then
            # remove 'selinux/' de obj-... += ... e subdir-... += ...
            sed -i -E 's#^([[:space:]]*(obj|subdir)[^=]*\+=.*)\bselinux/([[:space:]]*|$)#\1#g' "$mk"
            sed -i -E 's/[[:space:]]{2,}/ /g' "$mk"
            if grep -nE '^[[:space:]]*(obj|subdir)[^=]*\+=.*\bselinux/' "$mk"; then
              echo "::error::Ainda está listando selinux/ em obj/subdir no Makefile do KSU"; exit 3
            fi
          fi

      - name: Guard NR_ZSPAGES in taskstats.c (robusto)
        shell: bash
        run: |
          set -euxo pipefail
          cd "$KERNEL_DIR"
          f="kernel/taskstats.c"
          if grep -q 'zone_page_state *(.*NR_ZSPAGES)' "$f" && \
             ! awk 'f&&/#endif/{exit} /NR_ZSPAGES/&&/zone_page_state/{f=1} END{exit !f}' "$f"; then
            perl -0777 -pe 's/(\n[[:space:]]*zspages[[:space:]]*\+=[[:space:]]*zone_page_state[[:space:]]*\([[:space:]]*zone[[:space:]]*,[[:space:]]*NR_ZSPAGES[[:space:]]*\)[[:space:]]*;[[:space:]]*\n)/\n#ifdef CONFIG_ZSMALLOC\1#endif\n/s' -i "$f"
            echo "→ Guard NR_ZSPAGES aplicado"
          else
            echo "→ Guard já presente ou linha não encontrada"
          fi

      - name: Configurar e compilar (robusto)
        shell: bash
        run: |
          set -euxo pipefail
          cd "$KERNEL_DIR"
          export KCONFIG_CONFIG=out/.config
          export KBUILD_OUTPUT=out
          # KSU deve existir
          if [ ! -f drivers/kernelsu/Kconfig ]; then
            echo "::error::drivers/kernelsu/Kconfig ausente antes do defconfig"; exit 6;
          fi
          # 1) Resolver defconfig
          rm -f .config || true
          rm -rf include/config arch/arm64/include/generated || true
          want="${DEFCONFIG_NAME}"
          base="${want##*/}"
          path1="arch/arm64/configs/${want}"
          found=""
          if [[ -f "$path1" ]]; then
            found="$want"
          else
            cand="$(ls arch/arm64/configs/**/"$base" 2>/dev/null | head -n1 || true)"
            [[ -n "$cand" ]] && found="${cand#arch/arm64/configs/}"
          fi
          [[ -z "$found" ]] && { echo "::error::Defconfig '${want}' não encontrado"; exit 2; }
          echo "→ Usando defconfig: $found"
          # 2) Gerar .config
          make O=out ARCH=arm64 LLVM=1 CC=clang LD=ld.lld "$found" V=1        2>&1 | tee  build.log
          make O=out ARCH=arm64 LLVM=1 CC=clang LD=ld.lld olddefconfig        2>&1 | tee -a build.log
          make O=out ARCH=arm64 LLVM=1 CC=clang LD=ld.lld syncconfig          2>&1 | tee -a build.log
          # 3) Overrides – sem 'yes'
          chmod +x ./scripts/config
          ./scripts/config --file out/.config -e CONFIG_ZRAM      || true
          ./scripts/config --file out/.config -e CONFIG_ZSMALLOC  || true
          make O=out ARCH=arm64 LLVM=1 CC=clang LD=ld.lld olddefconfig        2>&1 | tee -a build.log
          echo "→ Checando ZSMALLOC/ZRAM no .config"
          grep -E '^(CONFIG_ZSMALLOC|CONFIG_ZRAM)=' out/.config || true
          # 4) Build
          set +e
          make -j"$(nproc)" \
            O=out ARCH=arm64 LLVM=1 CC=clang LD=ld.lld \
            AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            HOSTCC=clang HOSTCXX=clang++ V=1 \
            2>&1 | tee -a build.log
          rc=${PIPESTATUS[0]}
          set -e
          exit $rc

      - name: Diagnóstico de falha (se houver)
        if: failure()
        run: |
          set -euxo pipefail
          cd "$KERNEL_DIR"
          export KCONFIG_CONFIG=out/.config
          echo "=== HEAD do log (200 linhas) ==="; head -n 200 build.log || true
          echo "=== TAIL do log (200 linhas) ==="; tail -n 200 build.log || true
          echo "=== Erros encontrados (contexto ±3) ==="
          grep -nEi -C3 '(^|[[:space:]])(error:|fatal error:|undefined reference|No rule to make target|No such file or directory)' build.log || true
          echo "=== .config (parcial) ==="
          test -f out/.config && sed -n '1,200p' out/.config || true

      - name: Upload de logs e .config
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-e-config
          path: |
            ${{ env.KERNEL_DIR }}/build.log
            ${{ env.KERNEL_DIR }}/out/.config


      - name: Empacotar com AnyKernel3
        if: success()
        shell: bash
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE"
          rm -rf AnyKernel3
          git clone --depth 1 --branch "${AK3_BRANCH:-master}" "${AK3_SOURCE}" AnyKernel3
          KIMG="$KERNEL_DIR/out/arch/arm64/boot/Image.gz-dtb"
          if [[ ! -f "$KIMG" ]]; then
            echo "::error::Kernel Image não encontrado em $KIMG"
            ls -la "$KERNEL_DIR/out/arch/arm64/boot" || true
            exit 2
          fi
          cp -fv "$KIMG" AnyKernel3/
          cd AnyKernel3
          zip -r9 "../kernel-${ROM_TEXT:-build}.zip" . -x "*.git*"
          echo "ZIP_PATH=$GITHUB_WORKSPACE/kernel-${ROM_TEXT:-build}.zip" >> "$GITHUB_ENV"

      - name: Publicar artefato
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ env.ROM_TEXT || 'build' }}
          path: ${{ env.ZIP_PATH }}

