name: Build Kernel • star_hyper_a14

on:
  workflow_dispatch:
    inputs:
      PROFILE_NAME:
        description: "Arquivo de perfil em Profiles/ (ex.: star_hyper_a14.env)"
        required: true
        default: "star_hyper_a14.env"
      PYTHON_VERSION:
        description: "Versão do Python para toolings (2 ou 3)"
        required: true
        default: "3"

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      TZ: America/Sao_Paulo
      PROFILE_NAME: ${{ inputs.PROFILE_NAME }}
      PYTHON_VERSION: ${{ inputs.PYTHON_VERSION }}

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Mostrar versões do runner
        run: |
          set -euxo pipefail
          uname -a
          gcc --version || true
          clang --version || true
          python3 --version || true
          git --version

      # --- CORREÇÃO PRINCIPAL ---
      # 1) Normaliza quebras de linha do arquivo .env para LF
      # 2) Parse robusto das variáveis (ignora # e vazias, remove \r e aspas)
      - name: Carregar perfil
        id: load_env
        run: |
          set -euxo pipefail

          test -f "Profiles/${PROFILE_NAME}"
          echo "→ Perfil: Profiles/${PROFILE_NAME}"

          # Normaliza para LF (remove CR dos finais de linha)
          sed -i 's/\r$//' "Profiles/${PROFILE_NAME}"

          # Caso exista BOM no início
          perl -i -pe 'BEGIN{binmode(STDIN);binmode(STDOUT)} s/^\xEF\xBB\xBF//' "Profiles/${PROFILE_NAME}"

          # Exporta chaves KEY=VALUE válidas para o ambiente do job
          while IFS= read -r line; do
            # tira CR remanescente, espaços das pontas
            line="${line%$'\r'}"
            line="$(printf '%s' "$line" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"

            # ignora vazias e comentários
            [[ -z "$line" || "$line" =~ ^# ]] && continue

            # só aceita formato chave=valor
            if [[ "$line" == *=* ]]; then
              k="${line%%=*}"
              v="${line#*=}"

              # remove aspas e CR de valor
              v="${v%$'\r'}"
              v="${v%\"}"
              v="${v#\"}"

              echo "${k}=${v}" >> "$GITHUB_ENV"
            fi
          done < "Profiles/${PROFILE_NAME}"

          # Guard-rails
          : "${KERNEL_SOURCE:?KERNEL_SOURCE não definido no perfil}"
          : "${KERNEL_BRANCH:?KERNEL_BRANCH não definido no perfil}"
          : "${DEFCONFIG_NAME:?DEFCONFIG_NAME não definido no perfil}"

      - name: (Opcional) Baixar LLVM/Clang do perfil
        if: ${{ env.CLANG_SOURCE != '' }}
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/clang"
          curl -L --retry 3 --retry-delay 3 "$CLANG_SOURCE" -o /tmp/clang.tar.xz
          tar -xJf /tmp/clang.tar.xz -C "$GITHUB_WORKSPACE/clang" --strip-components=1
          echo "$GITHUB_WORKSPACE/clang/bin" >> $GITHUB_PATH
          echo "LLVM=1"        >> $GITHUB_ENV
          echo "LLVM_IAS=1"    >> $GITHUB_ENV
          echo "LD=ld.lld"     >> $GITHUB_ENV

      - name: Instalar toolchain fallback (se não baixou clang)
        if: ${{ env.CLANG_SOURCE == '' }}
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev \
              libelf-dev ccache python3 python2 curl git rsync lz4 \
              gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi
          echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
          echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> $GITHUB_ENV

      - name: Clonar fonte do Kernel
        run: |
          set -euxo pipefail
          rm -rf device_kernel
          git clone --depth=1 -b "$KERNEL_BRANCH" "$KERNEL_SOURCE" device_kernel
          cd device_kernel
          echo "KERNEL_TREE=$(pwd)" >> $GITHUB_ENV

      # ---------------------------------------------------------
      #  BLOCO KernelSU — robusto e idempotente
      #  Usa KERNELSU_SOURCE/KERNELSU_BRANCH do perfil; se não vier, define padrão
      # ---------------------------------------------------------
      - name: Injetar KernelSU no tree do kernel
        run: |
          set -euxo pipefail
          cd "$KERNEL_TREE"

          KS_DIR="drivers/kernelsu"
          KS_SRC="${KERNELSU_SOURCE:-https://github.com/rsuntk/KernelSU.git}"
          KS_BR="${KERNELSU_BRANCH:-main}"

          echo "→ Limpando destino para evitar conflito (arquivo/symlink/dir): $KS_DIR"
          rm -rf "$KS_DIR"
          mkdir -p "$KS_DIR"

          echo "→ Clonando KernelSU: $KS_SRC (branch: $KS_BR)"
          rm -rf /tmp/KernelSU
          git clone --depth=1 -b "$KS_BR" "$KS_SRC" /tmp/KernelSU

          echo "→ Copiando KernelSU para $KS_DIR"
          cp -av /tmp/KernelSU/kernel/* "$KS_DIR"/

          echo "→ Integrando Kconfig e Makefile"
          grep -q 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig || \
            echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig

          grep -q 'obj-$(CONFIG_KSU)      += kernelsu/' drivers/Makefile || \
            echo 'obj-$(CONFIG_KSU)      += kernelsu/' >> drivers/Makefile

      # Opcional: habilitar CONFIG_KSU=y direto na defconfig
      # - name: Habilitar CONFIG_KSU=y na defconfig
      #   run: |
      #     set -euxo pipefail
      #     cd "$KERNEL_TREE"
      #     grep -q "^CONFIG_KSU=y" "$DEFCONFIG_NAME" || echo "CONFIG_KSU=y" >> "$DEFCONFIG_NAME"

      - name: Sanear Makefiles/Config (CRLF/BOM/TAB)
        run: |
          set -euxo pipefail
          cd "$KERNEL_TREE"
          find . -type f \( -name "Makefile" -o -name "Kconfig" -o -name "*.mk" -o -name "*.cfg" \) \
            -print0 | xargs -0 sed -i 's/\r$//'

      # Hotfix específico (millet): inclui binder_internal por "aspas" no caminho relativo
      - name: Hotfix:binder_gki.c include path (millet)
        if: ${{ env.TARGET_DEVICE == 'millet' || env.TARGET_DEVICE == 'millet_global' || env.TARGET_DEVICE == 'milletpro' }}
        run: |
          set -euxo pipefail
          cd "$KERNEL_TREE"
          f="drivers/mihw/millet/binder_gki.c"
          if [ -f "$f" ]; then
            sed -i 's|<\.\./\.\./android/binder_internal\.h>|"../../android/binder_internal.h"|' "$f"
          fi

      - name: Compilar Kernel (defconfig + build)
        run: |
          set -euxo pipefail
          cd "$KERNEL_TREE"

          echo "Usando defconfig: ${DEFCONFIG_NAME}"

          export ARCH=arm64
          export SUBARCH=arm64

          # defconfig
          make -j"$(nproc)" "${DEFCONFIG_NAME}"

          # build
          make -j"$(nproc)" \
            ${LLVM:+LLVM=1} \
            ${LLVM_IAS:+LLVM_IAS=1} \
            ${LD:+LD=$LD} \
            ${CROSS_COMPILE:+CROSS_COMPILE=$CROSS_COMPILE} \
            ${CROSS_COMPILE_ARM32:+CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32}

          # artefatos de interesse
          mkdir -p "$GITHUB_WORKSPACE/out"
          for f in \
            arch/arm64/boot/Image.gz-dtb \
            arch/arm64/boot/Image.gz \
            arch/arm64/boot/Image \
            out/arch/arm64/boot/Image.gz-dtb \
            out/arch/arm64/boot/Image.gz \
            out/arch/arm64/boot/Image; do
            [ -f "$f" ] && cp -av "$f" "$GITHUB_WORKSPACE/out/" || true
          done

      - name: Empacotar com AnyKernel3
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE"
          rm -rf AnyKernel3
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git
          cp -av out/* AnyKernel3/ || true
          cd AnyKernel3
          zip -r9 "$GITHUB_WORKSPACE/Kernel-star_hyper_a14-$(date +%Y%m%d-%H%M).zip" ./

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-star_hyper_a14
          path: |
            out/**
            *.zip
