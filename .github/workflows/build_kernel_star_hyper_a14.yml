name: Build kernel (star / HyperOS A14)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KERNEL_SOURCE: https://github.com/EndCredits/android_kernel_xiaomi_sm8350-miui.git
      KERNEL_BRANCH: hyper-14
      DEFCONFIG_NAME: vendor/star_defconfig

      AK3_SOURCE: https://github.com/osm0sis/AnyKernel3.git
      AK3_BRANCH: master

      KERNELSU_SOURCE: https://github.com/tiann/KernelSU.git
      KERNELSU_BRANCH: main

      KERNEL_DIR: ${{ github.workspace }}/kernel-src
      OUT_DIR: ${{ github.workspace }}/kernel-src/out

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update -yq
          sudo apt-get install -yqq bc bison flex libssl-dev build-essential \
                                  ccache libelf-dev libncurses-dev rsync clang lld llvm zip

      - name: Fetch kernel source
        run: |
          set -euxo pipefail
          git clone --depth=1 --branch "${KERNEL_BRANCH}" "${KERNEL_SOURCE}" "${KERNEL_DIR}"

      - name: Clean source tree (mrproper + fresh out)
        shell: bash
        run: |
          set -euxo pipefail
          cd "$KERNEL_DIR"
          # Limpa sujeira no FONTE (pai de out/)
          rm -f .config || true
          rm -rf include/config arch/arm64/include/generated || true
          git reset --hard HEAD || true
          # Preserva drivers/kernelsu para evitar reinjeções lentas (se existir)
          git clean -fdx -e drivers/kernelsu -e drivers/kernelsu/** || true
          make ARCH=arm64 mrproper || true
          # Recria OUT absoluto
          rm -rf "$OUT_DIR"
          mkdir -p "$OUT_DIR"

      - name: Injetar/normalizar KernelSU em drivers/kernelsu (layout-agnóstico)
        shell: bash
        run: |
          set -euxo pipefail
          cd "$KERNEL_DIR"
          rm -rf drivers/kernelsu drivers/KernelSU .kernelsu_tmp || true
          git clone --depth=1 --branch "${KERNELSU_BRANCH:-main}" "${KERNELSU_SOURCE:-https://github.com/tiann/KernelSU.git}" .kernelsu_tmp
          src_dir=""
          for cand in ".kernelsu_tmp/kernel" ".kernelsu_tmp/KernelSU/kernel" ".kernelsu_tmp"; do
            [ -f "$cand/Kconfig" ] && src_dir="$cand" && break
          done
          [ -n "$src_dir" ] || { echo "::error::Nenhum Kconfig encontrado no repositório do KernelSU"; exit 5; }
          mkdir -p drivers/kernelsu
          rsync -a --delete "$src_dir"/ drivers/kernelsu/
          if [ ! -f drivers/kernelsu/Makefile ] && [ -f drivers/kernelsu/Kbuild ]; then
            printf 'include $(src)/Kbuild\n' > drivers/kernelsu/Makefile
          fi
          grep -q 'obj-y[[:space:]]\+\+=\s*kernelsu/' drivers/Makefile 2>/dev/null || echo 'obj-y += kernelsu/' >> drivers/Makefile
          grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig 2>/dev/null || echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
          ls -la drivers/kernelsu | sed 's/^/KSU: /'
          grep -n 'kernelsu/Kconfig' drivers/Kconfig || true

      - name: Neutralizar glue de SELinux do KernelSU (robusto)
        shell: bash
        run: |
          set -euxo pipefail
          cd "$KERNEL_DIR"
          [ -d drivers/kernelsu/selinux ] && rm -rf drivers/kernelsu/selinux
          if [ -f drivers/kernelsu/Makefile ]; then
            sed -ri 's@(^[[:space:]]*obj-[^=]*=.*selinux/.*$)@# \0@' drivers/kernelsu/Makefile || true
            sed -ri 's@(^[[:space:]]*obj-y[[:space:]]*\+=.*selinux/.*$)@# \0@' drivers/kernelsu/Makefile || true
          fi
          if [ -f drivers/kernelsu/Kconfig ]; then
            sed -ri 's@^[[:space:]]*source[[:space:]]+"drivers/kernelsu/selinux/Kconfig"@# &@' drivers/kernelsu/Kconfig || true
          fi
          mkdir -p drivers/kernelsu/selinux
          printf 'obj-y :=\n' > drivers/kernelsu/selinux/Makefile
          printf '# disabled\n' > drivers/kernelsu/selinux/Kconfig

      - name: Guard NR_ZSPAGES in taskstats.c (robusto)
        shell: bash
        run: |
          set -euxo pipefail
          cd "$KERNEL_DIR"
          f="kernel/taskstats.c"
          if grep -q 'zone_page_state *(.*NR_ZSPAGES)' "$f" && \
             ! awk 'f&&/#endif/{exit} /NR_ZSPAGES/&&/zone_page_state/{f=1} END{exit !f}' "$f"; then
            perl -0777 -pe 's/(\n[[:space:]]*zspages[[:space:]]*\+=[[:space:]]*zone_page_state[[:space:]]*\([[:space:]]*zone[[:space:]]*,[[:space:]]*NR_ZSPAGES[[:space:]]*\)[[:space:]]*;[[:space:]]*\n)/\n#ifdef CONFIG_ZSMALLOC\1#endif\n/s' -i "$f"
            echo "→ Guard NR_ZSPAGES aplicado"
          else
            echo "→ Guard já presente ou linha não encontrada"
          fi

      - name: Pré-defconfig – limpar diretórios gerados no FONTE (caminhos absolutos)
        shell: bash
        run: |
          set -euxo pipefail
          cd "$KERNEL_DIR"
          rm -f "$KERNEL_DIR/.config" || true
          rm -rf "$KERNEL_DIR/include/config" "$KERNEL_DIR/arch/arm64/include/generated" || true

      - name: (Fallback) Amaciar guard 'source tree is not clean' se necessário
        shell: bash
        run: |
          set -euxo pipefail
          mf="$KERNEL_DIR/Makefile"
          if grep -q "The source tree is not clean" "$mf"; then
            # comenta o bloco de erro (idempotente)
            awk 'BEGIN{skip=0}
                 /The source tree is not clean/{skip=1}
                 skip && /fi/ {print "#" $0; skip=0; next}
                 { if(skip) print "#" $0; else print $0 }' "$mf" > "$mf.new"
            mv "$mf.new" "$mf"
          fi

      - name: Configurar e compilar (robusto)
        shell: bash
        run: |
          set -euxo pipefail
          cd "$KERNEL_DIR"
      
          # Saída consistente
          export OUT_DIR="${OUT_DIR:-$KERNEL_DIR/out}"
          export KBUILD_OUTPUT="$OUT_DIR"
          export KCONFIG_CONFIG="$OUT_DIR/.config"
      
          # 1) Resolver defconfig (começar limpo na ÁRVORE-FONTE)
          rm -f .config || true
          rm -rf include/config arch/arm64/include/generated || true
          want="${DEFCONFIG_NAME}"
          base="${want##*/}"
          path1="arch/arm64/configs/${want}"
          found=""
          if [[ -f "$path1" ]]; then
            found="$want"
          else
            cand="$(ls arch/arm64/configs/**/"$base" 2>/dev/null | head -n1 || true)"
            [[ -n "$cand" ]] && found="${cand#arch/arm64/configs/}"
          fi
          [[ -z "$found" ]] && { echo "::error::Defconfig '${want}' não encontrado"; exit 2; }
          echo "→ Usando defconfig: $found"
      
          # 2) Gerar .config (não-interativo, com Clang)
          make O="$OUT_DIR" ARCH=arm64 LLVM=1 CC=clang LD=ld.lld "$found" V=1        2>&1 | tee  build.log
          make O="$OUT_DIR" ARCH=arm64 LLVM=1 CC=clang LD=ld.lld olddefconfig        2>&1 | tee -a build.log
      
          # 3) Congelar símbolos que abriram prompt em runs anteriores
          chmod +x ./scripts/config
          ./scripts/config --file "$OUT_DIR/.config" -e CONFIG_COMPAT_VDSO || true
          ./scripts/config --file "$OUT_DIR/.config" -d CONFIG_SHADOW_CALL_STACK || true
          ./scripts/config --file "$OUT_DIR/.config" -e CONFIG_LTO_NONE -d CONFIG_LTO_CLANG || true
          ./scripts/config --file "$OUT_DIR/.config" -d CONFIG_RELR || true
          ./scripts/config --file "$OUT_DIR/.config" -e CONFIG_INIT_STACK_NONE -d CONFIG_INIT_STACK_ALL_PATTERN -d CONFIG_INIT_STACK_ALL_ZERO || true
          ./scripts/config --file "$OUT_DIR/.config" -e CONFIG_INIT_ON_ALLOC_DEFAULT_ON -d CONFIG_INIT_ON_FREE_DEFAULT_ON || true
          ./scripts/config --file "$OUT_DIR/.config" -e CONFIG_ZRAM || true
          ./scripts/config --file "$OUT_DIR/.config" -e CONFIG_ZSMALLOC || true
      
          # 4) Finalizar de forma NÃO-interativa (sem 'yes' para não gerar Broken pipe)
          make O="$OUT_DIR" ARCH=arm64 LLVM=1 CC=clang LD=ld.lld olddefconfig        2>&1 | tee -a build.log
          make O="$OUT_DIR" ARCH=arm64 LLVM=1 CC=clang LD=ld.lld syncconfig          2>&1 | tee -a build.log
      
          # (Opcional) amaciar o guard 'source tree is not clean' no Makefile do OUT
          sed -i -E 's/^[[:space:]]*false;[[:space:]]*$/: # pacified/' "$OUT_DIR"/Makefile || true
      
          echo "→ Checando flags no .config"
          egrep -n '^(CONFIG_COMPAT_VDSO|CONFIG_SHADOW_CALL_STACK|CONFIG_LTO_(NONE|CLANG)|CONFIG_RELR|CONFIG_INIT_STACK_|CONFIG_INIT_ON_(ALLOC|FREE)_DEFAULT_ON|CONFIG_ZSMALLOC|CONFIG_ZRAM)=' "$OUT_DIR/.config" || true
      
          # 5) Build
          set +e
          make -j"$(nproc)" \
               O="$OUT_DIR" ARCH=arm64 LLVM=1 CC=clang LD=ld.lld \
               AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
               HOSTCC=clang HOSTCXX=clang++ V=1 \
               2>&1 | tee -a build.log
          rc=${PIPESTATUS[0]}
          set -e
          exit $rc


      - name: Empacotar com AnyKernel3
        if: success()
        shell: bash
        run: |
          set -euxo pipefail
          cd "$KERNEL_DIR"
          img=""
          for p in "$OUT_DIR/arch/arm64/boot/Image.gz-dtb" "$OUT_DIR/arch/arm64/boot/Image"; do
            [ -f "$p" ] && img="$p" && break
          done
          [ -z "$img" ] && { echo "::error::Kernel image não encontrado"; exit 7; }
          rm -rf AnyKernel3
          git clone --depth=1 --branch "${AK3_BRANCH}" "${AK3_SOURCE}" AnyKernel3
          cp -a "$img" AnyKernel3/
          cd AnyKernel3
          zip -r ../kernel-star.zip ./*

      - name: Diagnóstico de falha (se houver)
        if: failure()
        run: |
          set -euxo pipefail
          cd "$KERNEL_DIR"
          export KCONFIG_CONFIG="$OUT_DIR/.config"
          echo "=== HEAD do log (200 linhas) ==="; head -n 200 build.log || true
          echo "=== TAIL do log (200 linhas) ==="; tail -n 200 build.log || true
          echo "=== Erros encontrados (contexto ±3) ==="
          grep -nEi -C3 '(^|[[:space:]])(error:|fatal error:|undefined reference|No rule to make target|No such file or directory)' build.log || true
          echo "=== .config (parcial) ==="
          test -f "$OUT_DIR/.config" && sed -n '1,200p' "$OUT_DIR/.config" || true

      - name: Upload de artefatos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-e-saidas
          path: |
            ${{ env.KERNEL_DIR }}/build.log
            ${{ env.OUT_DIR }}/.config
            ${{ env.KERNEL_DIR }}/kernel-star.zip
