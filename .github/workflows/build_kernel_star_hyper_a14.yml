name: Build Kernel • star_hyper_a14

on:
  workflow_dispatch:
    inputs:
      DEFCONFIG_NAME:
        description: "Defconfig (ex.: vendor/gki_defconfig)"
        required: true
        default: "vendor/gki_defconfig"

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      KERNEL_DIR: ${{ github.workspace }}/kernel-src
      DEFCONFIG_NAME: ${{ github.event.inputs.DEFCONFIG_NAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependências
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates ccache curl flex \
            git gperf libncurses-dev libssl-dev python3 unzip xz-utils \
            clang lld llvm

      # === NOVO: carrega variáveis do perfil (URLs/branch/defconfig etc.) ===
      - name: Carregar perfil (Profiles/star_hyper_a14.env)
        shell: bash
        run: |
          set -euo pipefail
          PROFILE="Profiles/star_hyper_a14.env"
          if [[ ! -f "$PROFILE" ]]; then
            echo "::error::Perfil não encontrado: $PROFILE"
            exit 2
          fi
          sed -i 's/\r$//' "$PROFILE"
          while IFS= read -r raw || [[ -n "$raw" ]]; do
            [[ -z "$raw" || "$raw" =~ ^[[:space:]]*# ]] && continue
            if printf '%s' "$raw" | grep -Eq '^[A-Za-z_][A-Za-z0-9_]*=.+$'; then
              k="${raw%%=*}"; v="${raw#*=}"
              v="${v%\"}"; v="${v#\"}"; v="${v%\'}"; v="${v#\'}"
              echo "$k=$v" >> "$GITHUB_ENV"
            fi
          done < "$PROFILE"

          # DEFCONFIG_NAME do perfil tem prioridade; se não vier, mantém input/fallback
          if [[ -n "${DEFCONFIG_NAME:-}" ]]; then
            echo "DEFCONFIG_NAME=${DEFCONFIG_NAME}" >> "$GITHUB_ENV"
          else
            echo "DEFCONFIG_NAME=vendor/gki_defconfig" >> "$GITHUB_ENV"
          fi

          # checagens mínimas
          [[ -n "${KERNEL_SOURCE:-}" ]]  || { echo "::error::KERNEL_SOURCE ausente no perfil"; exit 2; }

      # === NOVO: clona a fonte do kernel a partir do perfil, com fallback de branch/tag ===
      - name: Clonar fonte do Kernel (usa perfil; robusto a branch/tag ausente)
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf "${KERNEL_DIR}"

          # Prioriza tag/commit (KERNEL_REF); se não houver, tenta branch; senão, branch padrão
          if [[ -n "${KERNEL_REF:-}" ]]; then
            git clone --depth 1 --branch "$KERNEL_REF" "$KERNEL_SOURCE" "${KERNEL_DIR}"
          else
            if [[ -n "${KERNEL_BRANCH:-}" ]] && git ls-remote --exit-code --heads "$KERNEL_SOURCE" "$KERNEL_BRANCH" >/dev/null 2>&1; then
              git clone --depth 1 --branch "$KERNEL_BRANCH" "$KERNEL_SOURCE" "${KERNEL_DIR}"
            else
              defb="$(git ls-remote --symref "$KERNEL_SOURCE" HEAD | awk '/^ref:/ {print $2}' | sed 's#refs/heads/##')"
              git clone --depth 1 --branch "$defb" "$KERNEL_SOURCE" "${KERNEL_DIR}"
            fi
          fi

          cd "${KERNEL_DIR}"
          # sanity check: precisa existir arch/arm64/configs
          [[ -d arch/arm64/configs ]] || { echo "::error::Árvore do kernel inválida (faltou arch/arm64/configs)"; exit 2; }

          # Garanta diretório de build separado
          mkdir -p out

      - name: Saneamento de Makefiles/Config (CRLF/BOM/TAB)
        run: |
          set -euxo pipefail
          cd "$KERNEL_DIR"
          # Evita problemas de final de linha acidental; usa arquivos versionados
          git ls-files | xargs -I{} sed -i 's/\r$//' {}

      - name: Compilar Kernel (defconfig + build, com log)
        shell: bash
        run: |
          set -euo pipefail
          cd "$KERNEL_DIR"

          want="${DEFCONFIG_NAME}"
          base="${want##*/}"
          path1="arch/arm64/configs/${want}"
          found=""

          if [[ -f "$path1" ]]; then
            found="$want"
          else
            cand="$(ls arch/arm64/configs/**/"$base" 2>/dev/null | head -n1 || true)"
            if [[ -n "$cand" ]]; then
              found="${cand#arch/arm64/configs/}"
            fi
          fi

          if [[ -z "$found" ]]; then
            echo "::warning::Defconfig '${want}' não encontrado. Usando fallback gki_defconfig…"
            found="gki_defconfig"
          fi

          echo "→ Defconfig selecionado: $found"

          # 1) Gera defconfig
          make O=out "$found" V=1 2>&1 | tee build.log

          # 2) Normaliza sem interação
          make O=out olddefconfig 2>&1 | tee -a build.log

          # 3) Overrides para contornar erro no zram (clang -Werror)
          chmod +x ./scripts/config
          ./scripts/config --file out/.config -d CONFIG_ZRAM || true
          ./scripts/config --file out/.config -d CONFIG_ZSMALLOC || true
          make O=out olddefconfig 2>&1 | tee -a build.log

          # 4) Build principal
          set +e
          make -j"$(nproc)" O=out CC=clang LD=ld.lld LLVM=1 V=1 \
               AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
               2>&1 | tee -a build.log
          MAKE_RC=${PIPESTATUS[0]}
          set -e

          if [[ $MAKE_RC -ne 0 ]]; then
            echo "::error::Compilação falhou. Verificando log…"
            exit $MAKE_RC
          fi

          ls -la out/arch/arm64/boot || true

      - name: Diagnóstico de falha (se houver)
        if: failure()
        shell: bash
        run: |
          set -euxo pipefail
          cd "$KERNEL_DIR"
          echo "=== HEAD do log (200 linhas) ==="
          head -n 200 build.log || true
          echo "=== TAIL do log (200 linhas) ==="
          tail -n 200 build.log || true
          echo "=== Erros encontrados (contexto ±3) ==="
          grep -nEi -C3 '(^| )error:|fatal error:|undefined reference|No rule to make target|No such file or directory' build.log || true
          echo "=== .config (parcial) ==="
          test -f out/.config && sed -n '1,160p' out/.config || true

      - name: Empacotar com AnyKernel3
        run: |
          echo "TODO: empacotar aqui se necessário…"

      - name: Upload de logs e .config
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-kernel-logs
          path: |
            ${{ env.KERNEL_DIR }}/build.log
            ${{ env.KERNEL_DIR }}/out/.config
