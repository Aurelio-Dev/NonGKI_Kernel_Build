name: Build Kernel • star_hyper_a14

on:
  workflow_dispatch:
    inputs:
      PROFILE_NAME:
        description: "Caminho do perfil em Profiles/ (ex.: Profiles/star_hyper_a14.env)"
        required: true
        type: string
        default: "Profiles/star_hyper_a14.env"
      PYTHON_VERSION:
        description: "Versão do Python usada no build (2 ou 3)"
        required: true
        type: choice
        options: ["2", "3"]
        default: "3"

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout deste repositório
        uses: actions/checkout@v4

      # ====== FIX #1: carregar o perfil e persistir variáveis no $GITHUB_ENV ======
      - name: Carregar perfil e exportar variáveis (persistir no $GITHUB_ENV)
        shell: bash
        run: |
          set -euo pipefail
          PERFIL="${{ inputs.PROFILE_NAME }}"
          echo "→ Perfil: $PERFIL"

          if [[ ! -f "$PERFIL" ]]; then
            echo "::error::Perfil não encontrado: $PERFIL"
            exit 1
          fi

          # Exporta pares CHAVE=valor (ignora comentários e linhas vazias)
          while IFS= read -r line; do
            [[ -z "$line" || "$line" =~ ^[[:space:]]*# ]] && continue
            if [[ "$line" =~ ^[A-Za-z0-9_]+[[:space:]]*= ]]; then
              key="$(printf '%s' "$line" | sed -E 's/^([A-Za-z0-9_]+)[[:space:]]*=.*/\1/')"
              val="$(printf '%s' "$line" | sed -E 's/^[A-Za-z0-9_]+[[:space:]]*=[[:space:]]*//')"
              # remove aspas ao redor, se houver
              val="${val%\"}"; val="${val#\"}"
              echo "$key=$val" >> "$GITHUB_ENV"
            fi
          done < "$PERFIL"

          echo "✓ Ambiente pronto e variáveis do perfil persistidas."

      - name: Summary
        shell: bash
        run: |
          echo "✓ Variáveis do perfil carregadas:"
          env | sort | sed -n '1,150p'
          echo "— Agora seguimos com os passos do build…"

      # (opcional) pegue AnyKernel3 se seu fluxo usa empacotamento AK3
      - name: Get AnyKernel3 (opcional)
        if: ${{ env.AK3_SOURCE != '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d AnyKernel3 ]]; then
            echo "AnyKernel3 já presente, pulando."
            exit 0
          fi
          if [[ -n "${AK3_SOURCE:-}" ]]; then
            AK3_BRANCH="${AK3_BRANCH:-master}"
            git clone --depth=1 --single-branch --branch "$AK3_BRANCH" "$AK3_SOURCE" AnyKernel3
            echo "✓ AnyKernel3 clonado."
          else
            echo "AK3_SOURCE não definido; pulando."
          fi

      # ====== FIX #2: clonar a fonte do kernel com fallback de branch ======
      - name: Clonar fonte do Kernel
        shell: bash
        run: |
          set -euo pipefail

          : "${KERNEL_SOURCE:=}"
          : "${KERNEL_BRANCH:=}"

          if [[ -z "${KERNEL_SOURCE}" ]]; then
            echo "::error::KERNEL_SOURCE não definido no perfil"
            exit 3
          fi

          echo "→ Repositório: $KERNEL_SOURCE"
          if [[ -n "${KERNEL_BRANCH}" ]]; then
            echo "→ Branch preferido: $KERNEL_BRANCH"
          else
            echo "→ Nenhum branch definido; usaremos o branch padrão do repositório."
          fi

          # Verifica se o branch existe no remoto
          BRANCH_OK=1
          if [[ -n "${KERNEL_BRANCH}" ]]; then
            if git ls-remote --heads "$KERNEL_SOURCE" "$KERNEL_BRANCH" > /dev/null 2>&1; then
              BRANCH_OK=0
            fi
          fi

          if [[ $BRANCH_OK -eq 0 ]]; then
            echo "→ Clonando com --branch $KERNEL_BRANCH (shallow)…"
            git clone --depth=1 --single-branch --branch "$KERNEL_BRANCH" "$KERNEL_SOURCE" device_kernel
          else
            echo "→ Branch não existe ou não definido. Clonando o branch padrão (shallow)…"
            git clone --depth=1 "$KERNEL_SOURCE" device_kernel
          fi

          echo "✓ Kernel clonado em ./device_kernel"

      # ====== daqui para baixo ficam os seus passos de build/packaging ======
      # Ex.: preparar toolchain, rodar defconfig, compilar, empacotar com AK3, publicar artefatos etc.
      # Mantive exemplos comentados; adapte ao seu fluxo.

