name: Build Kernel Star Hyper A14

on:
  workflow_dispatch:
    inputs:
      PROFILE_NAME:
        description: "Nome do arquivo de perfil em Profiles/ (ex.: star_hyper_a14.env)"
        required: true
        default: "star_hyper_a14.env"

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: "Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Lê o perfil, normaliza CRLF, exporta agora e persiste para próximos steps
      - name: "Carregar perfil"
        id: load_env
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p Profiles
          PROFILE_PATH="Profiles/${{ github.event.inputs.PROFILE_NAME }}"
          if [[ ! -f "${PROFILE_PATH}" ]]; then
            echo "::error::Arquivo de perfil não encontrado: ${PROFILE_PATH}"
            ls -la Profiles || true
            exit 2
          fi

          echo "→ Usando perfil: ${PROFILE_PATH}"
          sed -i 's/\r$//' "${PROFILE_PATH}"

          while IFS= read -r raw || [[ -n "$raw" ]]; do
            [[ -z "$raw" ]] && continue
            [[ "$raw" =~ ^[[:space:]]*# ]] && continue
            if printf '%s' "$raw" | grep -Eq '^[A-Za-z_][A-Za-z0-9_]*=.+$'; then
              k="${raw%%=*}"
              v="${raw#*=}"
              v="${v%\"}"; v="${v#\"}"; v="${v%\'}"; v="${v#\'}"
              k="${k%$'\r'}"; v="${v%$'\r'}"
              export "$k=$v"
              echo "$k=$v" >> "$GITHUB_ENV"
              printf '  %s=%s\n' "$k" "$v"
            fi
          done < "${PROFILE_PATH}"

          [[ -n "${KERNEL_SOURCE:-}" ]]  || { echo "::error::KERNEL_SOURCE não definido no perfil"; exit 2; }
          [[ -n "${DEFCONFIG_NAME:-}" ]] || { echo "::error::DEFCONFIG_NAME não definido no perfil"; exit 2; }

      - name: "(Opcional) Baixar LLVM/Clang do perfil"
        if: ${{ env.CLANG_SOURCE != '' }}
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y xz-utils curl
          mkdir -p toolchains && cd toolchains
          curl -L "$CLANG_SOURCE" -o clang.tar.xz
          tar -xJf clang.tar.xz
          CLANG_DIR="$(find "$(pwd)" -maxdepth 1 -type d -name '*clang*' | head -n1)"
          echo "CLANG_DIR=$CLANG_DIR" >> "$GITHUB_ENV"

      - name: "Instalar toolchain fallback (se não baixou clang)"
        if: ${{ env.CLANG_SOURCE == '' }}
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev \
                                  libncurses5-dev git wget curl jq python3 ccache \
                                  clang lld llvm

      - name: "Clonar fonte do Kernel (robusto a branch ausente)"
        id: clone_kernel
        shell: bash
        run: |
          set -euxo pipefail
          git --version
          rm -rf kernel-src || true

          if [[ -n "${KERNEL_REF:-}" ]]; then
            git clone --depth 1 --branch "$KERNEL_REF" "$KERNEL_SOURCE" kernel-src
          else
            if [[ -n "${KERNEL_BRANCH:-}" ]] && git ls-remote --exit-code --heads "$KERNEL_SOURCE" "$KERNEL_BRANCH" >/dev/null 2>&1; then
              git clone --depth 1 --branch "$KERNEL_BRANCH" "$KERNEL_SOURCE" kernel-src
            else
              default_branch="$(git ls-remote --symref "$KERNEL_SOURCE" HEAD | awk '/^ref:/ {print $2}' | sed 's#refs/heads/##')"
              git clone --depth 1 --branch "$default_branch" "$KERNEL_SOURCE" kernel-src
            fi
          fi

          echo "KERNEL_DIR=$GITHUB_WORKSPACE/kernel-src" >> "$GITHUB_ENV"

      - name: "Injetar KernelSU (robusto a submódulo vazio; garante KernelSU/Kconfig)"
        shell: bash
        run: |
          set -euxo pipefail
          cd "$KERNEL_DIR"

          # Se existir, checar se é repo válido e contém Kconfig
          need_clone=0
          if [[ -d KernelSU ]]; then
            if [[ ! -d KernelSU/.git ]] || { [[ ! -f KernelSU/Kconfig ]] && [[ ! -f KernelSU/kernel/Kconfig ]] ; }; then
              echo "→ KernelSU existe mas está vazio/submódulo não inicializado. Recriando…"
              rm -rf KernelSU
              need_clone=1
            fi
          else
            need_clone=1
          fi

          if [[ "$need_clone" -eq 1 ]]; then
            git clone --depth 1 --branch "${KERNELSU_BRANCH:-main}" "${KERNELSU_SOURCE}" KernelSU
          else
            echo "KernelSU já presente e utilizável."
          fi

          # Garante include e linkagem
          if ! grep -q "subdir-ccflags-y.*KernelSU/include" drivers/Makefile 2>/dev/null || true; then
            echo 'subdir-ccflags-y += -I$(srctree)/KernelSU/include' >> drivers/Makefile
          fi
          if ! grep -qE '(^|[[:space:]])obj-y[[:space:]]*\+=[[:space:]]*KernelSU/' drivers/Makefile 2>/dev/null || true; then
            echo 'obj-y += KernelSU/' >> drivers/Makefile
          fi

          # Garante que exista KernelSU/Kconfig (se só existir KernelSU/kernel/Kconfig, copia)
          if [[ ! -f KernelSU/Kconfig ]]; then
            if [[ -f KernelSU/kernel/Kconfig ]]; then
              cp -f KernelSU/kernel/Kconfig KernelSU/Kconfig
              echo "→ Copiado KernelSU/kernel/Kconfig -> KernelSU/Kconfig"
            else
              echo "::error::Não encontrei Kconfig do KernelSU em KernelSU/Kconfig nem KernelSU/kernel/Kconfig"
              ls -la KernelSU || true
              exit 2
            fi
          fi

          # drivers/Kconfig deve referenciar KernelSU/Kconfig
          sed -i 's#drivers/kernelsu/Kconfig#KernelSU/Kconfig#g; s#KernelSU/kernel/Kconfig#KernelSU/Kconfig#g' drivers/Kconfig || true
          if ! grep -q 'KernelSU/Kconfig' drivers/Kconfig 2>/dev/null; then
            printf '\nsource "KernelSU/Kconfig"\n' >> drivers/Kconfig
          fi

          echo "── Conteúdo de KernelSU/:"
          ls -la KernelSU || true

      - name: "Sanear Makefiles/Config (CRLF/BOM/TAB)"
        shell: bash
        run: |
          set -euxo pipefail
          cd "$KERNEL_DIR"
          # Versão rápida: processa apenas arquivos de TEXTO em lote
          git ls-files -z \
            | xargs -0 file --mime-type \
            | grep 'text/' \
            | cut -d: -f1 \
            | xargs -r sed -i 's/\r$//'

      - name: "Hotfix: binder_gki.c include path (millet)"
        shell: bash
        run: |
          set -euxo pipefail
          cd "$KERNEL_DIR"
          f="drivers/android/binder_gki.c"
          if [[ -f "$f" ]]; then
            sed -i 's|#include <uapi/linux/android/binder.h>|#include <linux/android/binder.h>|' "$f" || true
          fi

      - name: "Compilar Kernel (defconfig + build)"
        shell: bash
        run: |
          set -euxo pipefail
          cd "$KERNEL_DIR"

          export ARCH=arm64 SUBARCH=arm64 LC_ALL=C
          if [[ -n "${CLANG_DIR:-}" && -d "${CLANG_DIR}" ]]; then
            export PATH="${CLANG_DIR}/bin:${PATH}"
          fi

          make O=out "${DEFCONFIG_NAME}"
          make -j"$(nproc)" O=out CC=clang LD=ld.lld LLVM=1 \
               AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip

          ls -la out/arch/arm64/boot || true

      - name: "Empacotar com AnyKernel3"
        shell: bash
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE"
          rm -rf AnyKernel3
          git clone --depth 1 --branch "${AK3_BRANCH:-master}" "${AK3_SOURCE}" AnyKernel3

          KIMG="$KERNEL_DIR/out/arch/arm64/boot/Image.gz-dtb"
          if [[ ! -f "$KIMG" ]]; then
            echo "::error::Kernel Image não encontrado em $KIMG"
            ls -la "$KERNEL_DIR/out/arch/arm64/boot" || true
            exit 2
          fi
          cp -fv "$KIMG" AnyKernel3/
          cd AnyKernel3
          zip -r9 "../kernel-${ROM_TEXT:-build}.zip" . -x "*.git*"
          echo "ZIP_PATH=$GITHUB_WORKSPACE/kernel-${ROM_TEXT:-build}.zip" >> "$GITHUB_ENV"

      - name: "Publicar artefato"
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ env.ROM_TEXT || 'build' }}
          path: ${{ env.ZIP_PATH }}
