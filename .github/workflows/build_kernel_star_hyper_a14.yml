name: Build Kernel • star_hyper_a14

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Mostrar versões do runner
        run: |
          set -euo pipefail
          uname -a
          lsb_release -a || true
          gcc --version | head -n1
          clang --version | head -n1
          git --version

      # >>>>>>> PASSO CRÍTICO: carrega e exporta as variáveis do perfil
      - name: Carregar perfil (Profiles/star_hyper_a14.env)
        id: load_profile
        shell: bash
        run: |
          set -euo pipefail
          PROFILE_FILE="${{ github.workspace }}/Profiles/star_hyper_a14.env"

          if [[ ! -f "$PROFILE_FILE" ]]; then
            echo "::error file=Profiles/star_hyper_a14.env::Arquivo de perfil não encontrado."
            exit 1
          fi

          # Normaliza CRLF -> LF para evitar erros de parsing
          sed -i 's/\r$//' "$PROFILE_FILE"

          echo "## Carregando variáveis de $PROFILE_FILE"
          # Lê chave=valor, ignora comentários/linhas vazias e exporta
          while IFS='=' read -r key val; do
            [[ -z "${key// }" || "$key" =~ ^\# ]] && continue
            # remove aspas se existirem
            val="${val%\"}"; val="${val#\"}"; val="${val%\'}"; val="${val#\'}"
            export "$key=$val"
            printf '%s=%s\n' "$key" "$val" >> "$GITHUB_ENV"
          done < "$PROFILE_FILE"

          # Garantias mínimas (caso o .env não traga algo essencial)
          : "${KERNEL_SOURCE:=https://github.com/EndCredits/android_kernel_xiaomi_sm8350-miui.git}"
          : "${KERNEL_BRANCH:=hyper-14}"
          printf 'KERNEL_SOURCE=%s\nKERNEL_BRANCH=%s\n' "$KERNEL_SOURCE" "$KERNEL_BRANCH" >> "$GITHUB_ENV"

          echo "KERNEL_SOURCE=$KERNEL_SOURCE"
          echo "KERNEL_BRANCH=$KERNEL_BRANCH"
          # (opcional) mostre também o DEFCONFIG
          echo "DEFCONFIG_NAME=${DEFCONFIG_NAME:-<não definido no perfil>}"

      # (Opcional) Baixar LLVM/Clang
      - name: (Opcional) Baixar LLVM/Clang do perfil
        if: ${{ env.CLANG_SOURCE != '' }}
        shell: bash
        run: |
          set -euo pipefail
          URL="${CLANG_SOURCE}"
          echo "Baixando LLVM/Clang de: ${URL}"
          curl -fL --retry 5 --retry-delay 5 --connect-timeout 30 \
               -o llvm.tar.xz "${URL}"
          tar -xJf llvm.tar.xz
          LLVM_DIR=$(find . -maxdepth 1 -type d -name "LLVM-*" | head -n1)
          if [[ -z "${LLVM_DIR}" ]]; then
            echo "::error::Falha ao extrair LLVM."
            exit 2
          fi
          echo "${{ github.workspace }}/${LLVM_DIR}/bin" >> $GITHUB_PATH

      - name: Clonar fonte do Kernel
        shell: bash
        run: |
          set -euo pipefail
          test -n "${KERNEL_SOURCE:-}" || { echo "::error::KERNEL_SOURCE não definido"; exit 3; }
          BRANCH="${KERNEL_BRANCH:-${KERNEL_SOURCE_BRANCH:-}}"

          echo "Clonando: $KERNEL_SOURCE  (branch: ${BRANCH:-<default>})"
          if [[ -n "$BRANCH" ]]; then
            git clone --depth=1 -b "$BRANCH" "$KERNEL_SOURCE" device_kernel
          else
            git clone --depth=1 "$KERNEL_SOURCE" device_kernel
          fi
          echo "✓ Kernel clonado em ./device_kernel"

      - name: Sanear Makefiles/Config (CRLF/BOM/TAB)
        shell: bash
        working-directory: device_kernel
        run: |
          set -euo pipefail
          # Normaliza CRLF nos Makefiles/arquivos .mk e *.rc
          find . -type f \( -name 'Makefile*' -o -name '*.mk' -o -name '*.rc' \) -exec sed -i 's/\r$//' {} +
          # Normaliza também diretórios sensíveis (ex: drivers/input)
          find drivers -type f -exec sed -i 's/\r$//' {} + || true

      - name: Compilar Kernel (defconfig + build)
        shell: bash
        working-directory: device_kernel
        env:
          ARCH: arm64
          SUBARCH: arm64
        run: |
          set -euo pipefail
          DEFCONFIG="${DEFCONFIG_NAME:-vendor/star_defconfig}"

          echo "Usando defconfig: $DEFCONFIG"
          make O=out ARCH=arm64 "$DEFCONFIG"
          make -j"$(nproc)" O=out ARCH=arm64

      # (Opcional) empacotar com AnyKernel3 se o seu projeto usa AK3
      - name: Empacotar com AnyKernel3
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          # Exemplo mínimo; ajuste conforme seu projeto/AK3
          echo "Pulando empacotamento detalhado aqui (adicione o seu fluxo de AK3)."

      - name: Publicar artefato
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-build-out
          path: device_kernel/out/**
