name: Build Kernel • Star Hyper A14 (KernelSU)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      KERNEL_DIR: kernel-src
      OUT_DIR: kernel-src/out
      ANYKERNEL_DIR: AnyKernel3
      ARCH: arm64
      SUBARCH: arm64
      # ajuste se tiver um defconfig próprio; se não existir, cai no gki_defconfig
      DEFCONFIG: vendor/star_hyper_a14_defconfig

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache clang-14 flex git libssl-dev \
            libelf-dev lld-14 llvm-14 dwarves libncurses5-dev libncursesw5-dev \
            python3 zip unzip rsync cmake pkg-config libyaml-dev

          # Aponta clang/lld padrão para a versão 14 (evita binutils antigos quebrando LSE, etc)
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-14 140 \
                                   --slave /usr/bin/clang++ clang++ /usr/bin/clang++-14 \
                                   --slave /usr/bin/ld.lld ld.lld /usr/bin/ld.lld-14 \
                                   --slave /usr/bin/llvm-ar llvm-ar /usr/bin/llvm-ar-14 \
                                   --slave /usr/bin/llvm-nm llvm-nm /usr/bin/llvm-nm-14 \
                                   --slave /usr/bin/llvm-objcopy llvm-objcopy /usr/bin/llvm-objcopy-14 \
                                   --slave /usr/bin/llvm-objdump llvm-objdump /usr/bin/llvm-objdump-14

      # === Clone da fonte do kernel (mantenha sua origem atual; exemplo robusto) ===
      - name: Clonar fonte do Kernel (robusto a branch ausente)
        run: |
          set -euxo pipefail
          if [ ! -d "${KERNEL_DIR}" ]; then
            # Troque a URL/branch abaixo pela sua origem real
            git clone --depth=1 https://github.com/arter97/android_kernel_common ${KERNEL_DIR} || true
          fi
          cd "${KERNEL_DIR}"
          git rev-parse --is-inside-work-tree

      # === Injeção real do KernelSU (código + headers) ===
      - name: Injetar KernelSU (drivers/kernelsu + headers)
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -euxo pipefail

          # Clona KernelSU temporariamente
          rm -rf ../_ksu_tmp
          git clone --depth=1 https://github.com/tiann/KernelSU ../_ksu_tmp

          # Copia a pasta drivers/kernelsu
          mkdir -p drivers
          rsync -a ../_ksu_tmp/kernel/drivers/kernelsu/ drivers/kernelsu/

          # Copia os headers necessários (ksu*.h)
          rsync -a --include="ksu*.h" --include="*/" --exclude="*" \
            ../_ksu_tmp/kernel/include/linux/ include/linux/

          rm -rf ../_ksu_tmp

          # Garante include no Kconfig de drivers
          if ! grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig; then
            # insere antes do 'endmenu' final
            sed -i '/endmenu/i\source "drivers\/kernelsu\/Kconfig"' drivers/Kconfig
          fi

          # Garante entrada no Makefile de drivers
          if ! grep -q 'kernelsu/' drivers/Makefile; then
            echo 'obj-$(CONFIG_KERNELSU) += kernelsu/' >> drivers/Makefile
          fi

      # === Limpeza leve do OUT (não apagar árvore fonte) ===
      - name: Preparar OUT
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -euxo pipefail
          rm -rf "${OUT_DIR}"
          mkdir -p "${OUT_DIR}"

      # === Defconfig não-interativa (evita "explicit update") ===
      - name: Gerar .config (não-interativo)
        working-directory: ${{ env.KERNEL_DIR }}
        env:
          LLVM: 1
          CC: clang
          HOSTCC: clang
          ARCH: ${{ env.ARCH }}
          SUBARCH: ${{ env.SUBARCH }}
        run: |
          set -euxo pipefail

          # Se o defconfig indicado não existir, cair para gki_defconfig
          if ! [ -f "arch/arm64/configs/${DEFCONFIG}" ]; then
            echo "Warning: ${DEFCONFIG} não encontrado; usando gki_defconfig"
            make O="${OUT_DIR}" ARCH=${ARCH} SUBARCH=${SUBARCH} LLVM=1 CC=clang HOSTCC=clang gki_defconfig
          else
            make O="${OUT_DIR}" ARCH=${ARCH} SUBARCH=${SUBARCH} LLVM=1 CC=clang HOSTCC=clang "${DEFCONFIG}"
          fi

          # Força opções necessárias no .config
          "${PWD}/scripts/config" --file "${OUT_DIR}/.config" --enable  KERNELSU || true
          "${PWD}/scripts/config" --file "${OUT_DIR}/.config" --disable LTO_CLANG || true
          "${PWD}/scripts/config" --file "${OUT_DIR}/.config" --disable THINLTO || true
          "${PWD}/scripts/config" --file "${OUT_DIR}/.config" --enable  LTO_NONE || true

          # Resolve quaisquer novas opções sem interação
          yes "" | make O="${OUT_DIR}" ARCH=${ARCH} SUBARCH=${SUBARCH} LLVM=1 CC=clang HOSTCC=clang olddefconfig

      # === Build (Image + dtbs) ===
      - name: Compilar Kernel (olddefconfig + build, com log)
        working-directory: ${{ env.KERNEL_DIR }}
        env:
          LLVM: 1
          CC: clang
          HOSTCC: clang
          ARCH: ${{ env.ARCH }}
          SUBARCH: ${{ env.SUBARCH }}
        run: |
          set -euxo pipefail
          # flags padrões para evitar warnings fatais com clang
          export KCFLAGS="-Wno-error"
          make -j"$(nproc)" O="${OUT_DIR}" ARCH=${ARCH} SUBARCH=${SUBARCH} \
               LLVM=1 CC=clang HOSTCC=clang \
               Image.gz-dtb

      # === Empacotar com AnyKernel3 (se você já tem este diretório no repo) ===
      - name: Empacotar com AnyKernel3
        if: ${{ always() }}
        run: |
          set -euxo pipefail
          if [ -d "${ANYKERNEL_DIR}" ] && [ -f "${{ env.OUT_DIR }}/arch/arm64/boot/Image.gz-dtb" ]; then
            cp -f "${{ env.OUT_DIR }}/arch/arm64/boot/Image.gz-dtb" "${ANYKERNEL_DIR}/Image.gz-dtb"
            cd "${ANYKERNEL_DIR}"
            zip -r9 ../debug-kernel-ksu.zip ./*
          else
            echo "AnyKernel3 ausente ou Image.gz-dtb não gerada; pulando empacote."
          fi

      - name: Publicar artefato
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: debug-kernel-logs
          path: |
            ${{ env.KERNEL_DIR }}/out/build.log
            debug-kernel-ksu.zip
          if-no-files-found: warn
