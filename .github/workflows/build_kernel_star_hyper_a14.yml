name: Build Kernel • star_hyper_a14

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      # Caminho do perfil (já existente no repo)
      PROFILE_FILE: Profiles/star_hyper_a14.env
      # Direto para onde vamos clonar a árvore do kernel
      KERNEL_DIR: device_kernel
      # AnyKernel3 opcional (se não existir, o passo ignora)
      AK3_DIR: AnyKernel3

    steps:
      # 0) Checkout do repositório (seu fork)
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 1) Obter AnyKernel3 (opcional; se já estiver no repo, não faz nada)
      - name: Obter AnyKernel3 (se não houver)
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -d "$AK3_DIR" ]]; then
            echo "→ Clonando AnyKernel3 (opcional)…"
            git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git "$AK3_DIR"
          else
            echo "✓ AnyKernel3 já presente."
          fi

      # 2) (Opcional) Baixar e preparar LLVM/Clang do perfil
      #    Esse passo depende do CLANG_SOURCE estar definido no perfil
      - name: (Opcional) Baixar e preparar LLVM/Clang do perfil
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "$PROFILE_FILE" ]]; then
            # Exporta só as linhas chave=valor, removendo prefixos "CUSTOM_CMDS:" e "EXTRA_CMDS:"
            # e ignorando comentários/espaços.
            TMP_EXPORT="$(mktemp)"
            sed -E 's/^\s*#.*$//g; s/\r$//g' "$PROFILE_FILE" \
            | sed -E 's/^(CUSTOM_CMDS:|EXTRA_CMDS:)\s*//g' \
            | grep -E '^[A-Za-z0-9_]+=' > "$TMP_EXPORT" || true
            # Carrega variáveis do perfil no ambiente
            # shellcheck disable=SC2046
            export $(sed -n 's/^\([A-Za-z0-9_]\+\)=.*/\1/p' "$TMP_EXPORT")
            # Persiste para os próximos passos
            cat "$TMP_EXPORT" >> "$GITHUB_ENV"
            rm -f "$TMP_EXPORT"
            echo "✓ Variáveis do perfil carregadas."
          fi

          # Se não tem CLANG_SOURCE no perfil, apenas sai (build pode usar clang do sistema)
          if [[ -z "${CLANG_SOURCE:-}" ]]; then
            echo "→ CLANG_SOURCE não definido no perfil; passo LLVM é opcional e será pulado."
            exit 0
          fi
        continue-on-error: false

      # 2.1) Preparar LLVM/Clang (opcional) — BLOCO ROBUSTO
      - name: Preparar LLVM/Clang (opcional)
        if: ${{ env.CLANG_SOURCE != '' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p toolchains && cd toolchains

          echo "→ Baixando LLVM/Clang de: $CLANG_SOURCE"
          # Baixa com reintentos e retoma (-C -)
          curl -L --retry 5 --retry-delay 10 -A "GitHubActions/1.0" -C - \
            "$CLANG_SOURCE" -o clang.tar.xz

          echo "→ Validando o tarball..."
          if ! xz -t clang.tar.xz 2>/dev/null; then
            echo "Arquivo inválido (xz -t falhou). Dump rápido:"
            file clang.tar.xz || true
            head -c 512 clang.tar.xz | od -An -tx1 || true
            echo "-> Fallback: instalar Clang/Lld via apt.llvm.org"
            cd ..
            sudo apt-get update
            sudo apt-get install -y wget gnupg ca-certificates lsb-release
            wget https://apt.llvm.org/llvm.sh
            chmod +x llvm.sh
            sudo ./llvm.sh 19 all
            echo "CLANG_BIN=clang-19" >> "$GITHUB_ENV"
            echo "LLD_BIN=ld.lld-19"  >> "$GITHUB_ENV"
            exit 0
          fi

          echo "→ Extraindo..."
          tar -xf clang.tar.xz
          CLANG_DIR="$(ls -1d LLVM-* clang-* 2>/dev/null | head -n1)"
          if [[ -z "$CLANG_DIR" ]]; then
            echo "::error::Não foi possível localizar a pasta do LLVM/Clang após extrair."
            ls -la
            exit 10
          fi

          echo "PATH=$PWD/$CLANG_DIR/bin:$PATH" >> "$GITHUB_ENV"
          echo "CLANG_BIN=clang"  >> "$GITHUB_ENV"
          echo "LLD_BIN=ld.lld"   >> "$GITHUB_ENV"
          echo "✓ LLVM/Clang pronto em: $PWD/$CLANG_DIR/bin"

      # 3) Clonar fonte do Kernel (usa KERNEL_SOURCE/KERNEL_BRANCH do perfil)
      - name: Clonar fonte do Kernel
        shell: bash
        run: |
          set -euo pipefail
          : "${KERNEL_SOURCE:?KERNEL_SOURCE não definido no perfil}"
          if [[ -z "${KERNEL_BRANCH:-}" ]]; then
            echo "::error::KERNEL_BRANCH não definido no perfil."
            exit 3
          fi

          if [[ -d "$KERNEL_DIR/.git" ]]; then
            echo "✓ Kernel já clonado em $KERNEL_DIR"
          else
            echo "→ Clonando kernel: $KERNEL_SOURCE (branch: $KERNEL_BRANCH)"
            git clone --depth=1 -b "$KERNEL_BRANCH" "$KERNEL_SOURCE" "$KERNEL_DIR"
          fi
          echo "✓ Kernel clonado em ./$KERNEL_DIR"

      # 4) Compilar Kernel (defconfig + build) — usa CLANG_BIN/LLD_BIN automaticamente
      - name: Compilar Kernel (defconfig + build)
        shell: bash
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -euo pipefail

          # Usa DEFCONFIG_NAME do perfil (ex.: vendor/star_defconfig)
          : "${DEFCONFIG_NAME:?DEFCONFIG_NAME não definido no perfil}"

          # Detecta toolchain escolhida (via passo LLVM) ou padrão
          CC_BIN="${CLANG_BIN:-clang}"
          LD_BIN="${LLD_BIN:-ld.lld}"

          echo "→ Preparando saída O=out"
          mkdir -p out

          echo "→ Limpando e aplicando defconfig: $DEFCONFIG_NAME"
          make -j"$(nproc)" O=out mrproper
          make -j"$(nproc)" O=out "$DEFCONFIG_NAME"

          echo "→ Compilando com CC=$CC_BIN / LD=$LD_BIN"
          make -j"$(nproc)" O=out \
            CC="$CC_BIN" LD="$LD_BIN" LLVM=1 LLVM_IAS=1 \
            ${CLANG_TRIPLE:+CLANG_TRIPLE=$CLANG_TRIPLE} \
            ${CROSS_COMPILE:+CROSS_COMPILE=$CROSS_COMPILE} \
            ${CROSS_COMPILE_ARM32:+CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32}

          echo "→ Artefatos produzidos:"
          ls -lh out/arch/arm64/boot || true

      # 5) Empacotar com AnyKernel3 (se disponível)
      - name: Empacotar com AnyKernel3
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -d "$AK3_DIR" ]]; then
            echo "AnyKernel3 não está presente; pulando empacotamento."
            exit 0
          fi

          BOOT_DIR="$KERNEL_DIR/out/arch/arm64/boot"
          IMG=""
          # Tenta formatos comuns
          for f in Image.gz-dtb Image.gz Image; do
            if [[ -f "$BOOT_DIR/$f" ]]; then
              IMG="$BOOT_DIR/$f"
              break
            fi
          done

          if [[ -z "$IMG" ]]; then
            echo "::warning::Não encontrei Image*/Image.gz-dtb para empacotar."
            ls -lah "$BOOT_DIR" || true
            exit 0
          fi

          echo "→ Copiando $IMG para AnyKernel3"
          cp -f "$IMG" "$AK3_DIR"/Image.gz-dtb 2>/dev/null || cp -f "$IMG" "$AK3_DIR"/Image

          ZIP_NAME="Kernel-star_hyper_a14-$(date +%F-%H%M).zip"
          echo "→ Gerando $ZIP_NAME"
          ( cd "$AK3_DIR" && zip -r9 "../$ZIP_NAME" * >/dev/null )
          echo "PACKAGE_ZIP=$ZIP_NAME" >> "$GITHUB_ENV"

      # 6) Publicar artefato (zip se disponível; senão, boot files)
      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: kernel-star_hyper_a14
          path: |
            ${{ env.PACKAGE_ZIP }}
            ${{ env.KERNEL_DIR }}/out/arch/arm64/boot/*
          if-no-files-found: warn
