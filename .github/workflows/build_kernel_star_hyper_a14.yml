name: Build Kernel • star_hyper_a14

on:
  workflow_dispatch:
    inputs:
      PROFILE_NAME:
        description: "Arquivo de perfil em Profiles/ (ex.: star_hyper_a14.env)"
        required: true
        default: "star_hyper_a14.env"
      PYTHON_VERSION:
        description: "Versão do Python para toolings (2 ou 3)"
        required: true
        default: "3"

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      TZ: America/Sao_Paulo
      PROFILE_NAME: ${{ inputs.PROFILE_NAME }}
      PYTHON_VERSION: ${{ inputs.PYTHON_VERSION }}

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Mostrar versões do runner
        run: |
          set -euxo pipefail
          uname -a
          gcc --version || true
          clang --version || true
          python3 --version || true
          git --version

      - name: Carregar perfil
        id: load_env
        run: |
          set -euxo pipefail
          test -f "Profiles/${PROFILE_NAME}"
          echo "→ Perfil: Profiles/${PROFILE_NAME}"

          # Normaliza CRLF -> LF para evitar chaves com '\r'
          sed -i 's/\r$//' "Profiles/${PROFILE_NAME}"

          # Lê KEY=VALUE, ignora vazias e comentários, exporta AGORA
          while IFS='=' read -r k v; do
            # pula linhas vazias/comentário
            [ -z "${k}" ] && continue
            case "$k" in \#*) continue;; esac
            # remove aspas ao redor, se houver
            v="${v%\"}"; v="${v#\"}"
            # exporta para ESTE passo
            export "$k=$v"
            # e para os próximos passos
            echo "$k=$v" >> "$GITHUB_ENV"
          done < "Profiles/${PROFILE_NAME}"

          # Guard-rails (agora visíveis porque exportamos)
          test -n "${KERNEL_SOURCE:-}"   || { echo "::error::KERNEL_SOURCE não definido no perfil"; exit 3; }
          test -n "${KERNEL_BRANCH:-}"   || { echo "::error::KERNEL_BRANCH não definido no perfil"; exit 3; }
          test -n "${DEFCONFIG_NAME:-}"  || { echo "::error::DEFCONFIG_NAME não definido no perfil"; exit 3; }

      - name: (Opcional) Baixar LLVM/Clang do perfil
        if: ${{ env.CLANG_SOURCE != '' }}
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/clang"
          curl -L --retry 3 --retry-delay 3 "$CLANG_SOURCE" -o /tmp/clang.tar.xz
          tar -xJf /tmp/clang.tar.xz -C "$GITHUB_WORKSPACE/clang" --strip-components=1
          echo "$GITHUB_WORKSPACE/clang/bin" >> $GITHUB_PATH
          echo "LLVM=1"        >> $GITHUB_ENV
          echo "LLVM_IAS=1"    >> $GITHUB_ENV
          echo "LD=ld.lld"     >> $GITHUB_ENV

      - name: Instalar toolchain fallback (se não baixou clang)
        if: ${{ env.CLANG_SOURCE == '' }}
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev \
              libelf-dev ccache python3 python2 curl git rsync lz4 \
              gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi
          echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
          echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> $GITHUB_ENV

      - name: Clonar fonte do Kernel
        run: |
          set -euxo pipefail
          rm -rf device_kernel
          git clone --depth=1 -b "$KERNEL_BRANCH" "$KERNEL_SOURCE" device_kernel
          cd device_kernel
          echo "KERNEL_TREE=$(pwd)" >> $GITHUB_ENV

      # ---------------------------------------------------------
      #  BLOCO KernelSU — robusto contra diretório existente
      #  (não falha se drivers/kernelsu já existir)
      # ---------------------------------------------------------
      - name: Injetar KernelSU no tree do kernel
        run: |
          set -euxo pipefail
          cd "$KERNEL_TREE"

          # Onde vamos colocar o KernelSU?
          KS_DIR=""
          for d in drivers/kernelsu drivers/ksu drivers/misc/kernelsu; do
            if [ -d "$d" ]; then KS_DIR="$d"; break; fi
          done
          [ -z "$KS_DIR" ] && KS_DIR="drivers/kernelsu"

          mkdir -p "$KS_DIR" || true

          # Clona/atualiza fontes
          if [ ! -f "$KS_DIR/Kconfig" ] || [ ! -f "$KS_DIR/Makefile" ]; then
            git clone --depth=1 -b susfs-main https://github.com/rsuntk/KernelSU.git /tmp/KernelSU
            cp -av /tmp/KernelSU/kernel/* "$KS_DIR"/
          fi

          # Makefile mínimo (caso não exista)
          if [ ! -s "$KS_DIR/Makefile" ]; then
            printf '%s\n' \
              'obj-$(CONFIG_KSU) += ksu.o' \
              'ksu-y := main.o' > "$KS_DIR/Makefile"
          fi

          # Kconfig mínimo (caso não exista)
          if [ ! -s "$KS_DIR/Kconfig" ]; then
            printf '%s\n' \
              'config KSU' \
              '    bool "KernelSU"' \
              '    default n' \
              '    help' \
              '      Enable KernelSU support.' > "$KS_DIR/Kconfig"
          fi

          # Garante include no drivers/Kconfig (uma única vez)
          grep -q 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig || \
            echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig

          # Garante entrada no drivers/Makefile
          grep -q 'obj-$(CONFIG_KSU).*+=.*kernelsu' drivers/Makefile || \
            echo 'obj-$(CONFIG_KSU)      += kernelsu/' >> drivers/Makefile

      - name: Sanear Makefiles/Config (CRLF/BOM/TAB)
        run: |
          set -euxo pipefail
          cd "$KERNEL_TREE"
          find . -type f \( -name "Makefile" -o -name "Kconfig" -o -name "*.mk" -o -name "*.cfg" \) \
            -print0 | xargs -0 sed -i 's/\r$//'

      - name: Compilar Kernel (defconfig + build)
        run: |
          set -euxo pipefail
          cd "$KERNEL_TREE"

          echo "Usando defconfig: ${DEFCONFIG_NAME}"

          export ARCH=arm64
          export SUBARCH=arm64

          make -j"$(nproc)" "${DEFCONFIG_NAME}"

          make -j"$(nproc)" \
            ${LLVM:+LLVM=1} \
            ${LLVM_IAS:+LLVM_IAS=1} \
            ${LD:+LD=$LD} \
            ${CROSS_COMPILE:+CROSS_COMPILE=$CROSS_COMPILE} \
            ${CROSS_COMPILE_ARM32:+CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32}

          mkdir -p "$GITHUB_WORKSPACE/out"
          for f in \
            arch/arm64/boot/Image.gz-dtb \
            arch/arm64/boot/Image.gz \
            arch/arm64/boot/Image \
            out/arch/arm64/boot/Image.gz-dtb \
            out/arch/arm64/boot/Image.gz \
            out/arch/arm64/boot/Image; do
            [ -f "$f" ] && cp -av "$f" "$GITHUB_WORKSPACE/out/" || true
          done

      - name: Empacotar com AnyKernel3
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE"
          rm -rf AnyKernel3
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git
          cp -av out/* AnyKernel3/
          cd AnyKernel3
          zip -r9 "$GITHUB_WORKSPACE/Kernel-star_hyper_a14-$(date +%Y%m%d-%H%M).zip" ./

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-star_hyper_a14
          path: |
            out/**
            *.zip
