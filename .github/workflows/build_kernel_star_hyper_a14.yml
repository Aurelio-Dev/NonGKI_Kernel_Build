name: Build Kernel • star_hyper_a14

on:
  workflow_dispatch:
    inputs:
      DEFCONFIG_NAME:
        description: "Defconfig (ex.: vendor/gki_defconfig)"
        required: true
        default: "vendor/gki_defconfig"

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      KERNEL_DIR: ${{ github.workspace }}/kernel-src
      DEFCONFIG_NAME: ${{ github.event.inputs.DEFCONFIG_NAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependências
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates ccache curl flex \
            git gperf libncurses-dev libssl-dev python3 unzip xz-utils \
            clang lld llvm

      - name: Clonar fonte do Kernel (robusto a branch ausente)
        run: |
          set -euxo pipefail
          # Seu repositório já está checado. Se precisar clonar outro, faça aqui.

          # Garanta diretório de build separado
          mkdir -p "$KERNEL_DIR/out"

      - name: Saneamento de Makefiles/Config (CRLF/BOM/TAB)
        run: |
          set -euxo pipefail
          cd "$KERNEL_DIR"
          # Evita problemas de final de linha acidental
          git ls-files | xargs -I{} sed -i 's/\r$//' {}

      - name: Compilar Kernel (defconfig + build, com log)
        shell: bash
        run: |
          set -euo pipefail
          cd "$KERNEL_DIR"

          want="${DEFCONFIG_NAME}"
          base="${want##*/}"
          path1="arch/arm64/configs/${want}"
          found=""

          if [[ -f "$path1" ]]; then
            found="$want"
          else
            cand="$(ls arch/arm64/configs/**/"$base" 2>/dev/null | head -n1 || true)"
            if [[ -n "$cand" ]]; then
              found="${cand#arch/arm64/configs/}"
            else
              prefix="${base%_defconfig}"
              cand="$(git ls-files arch/arm64/configs | grep -E "/${base}$" | head -n1 || true)"
              [[ -z "$cand" ]] && cand="$(git ls-files arch/arm64/configs | grep -E "/${prefix}.*_defconfig$" | head -n1 || true)"
              if [[ -n "$cand" ]]; then
                found="${cand#arch/arm64/configs/}"
              fi
            fi
          fi

          if [[ -z "$found" ]]; then
            echo "::warning::Defconfig '${want}' não encontrado. Listando alguns candidatos:"
            find arch/arm64/configs -maxdepth 2 -name "*defconfig" | head -n 200 || true
            for fb in vendor/gki_defconfig gki_defconfig; do
              if [[ -f "arch/arm64/configs/$fb" ]]; then found="$fb"; echo "→ Usando fallback: $fb"; break; fi
            done
          fi

          if [[ -z "$found" ]]; then
            echo "::error::Nenhum defconfig compatível encontrado (queria '${want}')."
            exit 2
          fi

          echo "→ Defconfig selecionado: $found"

          # 1) Gera defconfig
          make O=out "$found" V=1 2>&1 | tee build.log

          # 2) Normaliza sem interação
          make O=out olddefconfig 2>&1 | tee -a build.log

          # 3) **Overrides para contornar erro no zram (clang -Werror)**
          #    Desabilitamos zram e zsmalloc e re-rodamos olddefconfig
          #    (se você quiser zram, dá pra reverter isso depois e aplicar patch/flags)
          chmod +x ./scripts/config
          ./scripts/config --file out/.config -d CONFIG_ZRAM || true
          ./scripts/config --file out/.config -d CONFIG_ZSMALLOC || true
          make O=out olddefconfig 2>&1 | tee -a build.log

          # 4) Build principal
          set +e
          make -j"$(nproc)" O=out CC=clang LD=ld.lld LLVM=1 V=1 \
               AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
               2>&1 | tee -a build.log
          MAKE_RC=${PIPESTATUS[0]}
          set -e

          if [[ $MAKE_RC -ne 0 ]]; then
            echo "::error::Compilação falhou. Verificando log…"
            exit $MAKE_RC
          fi

          ls -la out/arch/arm64/boot || true

      - name: Diagnóstico de falha (se houver)
        if: failure()
        shell: bash
        run: |
          set -euxo pipefail
          cd "$KERNEL_DIR"
          echo "=== HEAD do log (200 linhas) ==="
          head -n 200 build.log || true
          echo "=== TAIL do log (200 linhas) ==="
          tail -n 200 build.log || true
          echo "=== Erros encontrados (contexto ±3) ==="
          grep -nEi -C3 '(^| )error:|fatal error:|undefined reference|No rule to make target|No such file or directory' build.log || true
          echo "=== .config (parcial) ==="
          test -f out/.config && sed -n '1,160p' out/.config || true

      - name: Empacotar com AnyKernel3
        run: |
          echo "TODO: empacotar aqui se necessário…"

      - name: Upload de logs e .config
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-kernel-logs
          path: |
            ${{ env.KERNEL_DIR }}/build.log
            ${{ env.KERNEL_DIR }}/out/.config
