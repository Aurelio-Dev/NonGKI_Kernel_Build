      - name: Integrar KernelSU (se ausente)
        shell: bash
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -euo pipefail

          # 1) Se drivers/kernelsu não existir, clona e injeta o código do KernelSU
          if [[ ! -f drivers/kernelsu/Makefile ]]; then
            echo "→ Injetando KernelSU em drivers/kernelsu/"
            rm -rf /tmp/ksu
            git clone --depth=1 -b susfs-main https://github.com/rsuntk/KernelSU.git /tmp/ksu
            mkdir -p drivers/kernelsu
            rsync -a --delete /tmp/ksu/kernel/ drivers/kernelsu/
          else
            echo "✓ drivers/kernelsu já presente"
          fi

          # 2) Garantir referências em drivers/Kconfig
          if ! grep -q 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig; then
            echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
            echo "→ Adicionado include do Kconfig do KernelSU em drivers/Kconfig"
          else
            echo "✓ drivers/Kconfig já referencia drivers/kernelsu/Kconfig"
          fi

          # 3) Garantir referências em drivers/Makefile
          if ! grep -q 'obj-\$(CONFIG_KSU) \+= kernelsu/' drivers/Makefile; then
            echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
            echo "→ Adicionado obj-$(CONFIG_KSU) += kernelsu/ em drivers/Makefile"
          else
            echo "✓ drivers/Makefile já referencia kernelsu/"
          fi

      # (opcional mas recomendado) saneamento de finais de linha/BOM que você já tem
      # - name: Sanear Makefiles/Kconfig (CRLF/BOM/TAB)
      #   ...

      - name: Compilar Kernel (defconfig + build)
        shell: bash
        working-directory: ${{ env.KERNEL_DIR }}
        env:
          DEFCONFIG_NAME: ${{ env.DEFCONFIG_NAME }}  # já deve estar vindo do seu env
          TOOLCHAIN: ${{ env.TOOLCHAIN }}
        run: |
          set -euo pipefail

          echo "→ Limpando out e preparando build"
          mkdir -p out
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER=runner
          export KBUILD_BUILD_HOST=github
          export PATH="${TOOLCHAIN}:${PATH}"

          # Defconfig
          make O=out ${DEFCONFIG_NAME}

          # Ativar CONFIG_KSU=y na configuração final
          echo 'CONFIG_KSU=y' > /tmp/ksu.config
          if [[ -x scripts/kconfig/merge_config.sh ]]; then
            scripts/kconfig/merge_config.sh -O out out/.config /tmp/ksu.config
            make O=out olddefconfig
          else
            cat /tmp/ksu.config >> out/.config
            yes "" | make O=out olddefconfig
          fi

          # Compilar (ajuste -j conforme necessário)
          make -j"$(nproc)" O=out

