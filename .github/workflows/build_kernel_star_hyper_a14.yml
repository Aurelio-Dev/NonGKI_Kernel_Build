name: Build Kernel Star Hyper A14

on:
  workflow_dispatch:
    inputs:
      PROFILE_NAME:
        description: "Nome do arquivo de perfil em Profiles/ (ex.: star_hyper_a14.env)"
        required: true
        default: "star_hyper_a14.env"

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: "Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Lê o perfil, normaliza CRLF, EXPORTA no ambiente ATUAL e persiste no GITHUB_ENV
      - name: "Carregar perfil"
        id: load_env
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p Profiles
          PROFILE_PATH="Profiles/${{ github.event.inputs.PROFILE_NAME }}"
          if [[ ! -f "${PROFILE_PATH}" ]]; then
            echo "::error::Arquivo de perfil não encontrado: ${PROFILE_PATH}"
            echo "Arquivos disponíveis em Profiles/:"
            ls -la Profiles || true
            exit 2
          fi

          echo "→ Usando perfil: ${PROFILE_PATH}"
          # Normaliza CRLF -> LF
          sed -i 's/\r$//' "${PROFILE_PATH}"

          # Exporta KEY=VALUE válidos (agora e para os próximos steps)
          while IFS= read -r raw || [[ -n "$raw" ]]; do
            [[ -z "$raw" ]] && continue
            [[ "$raw" =~ ^[[:space:]]*# ]] && continue
            if printf '%s' "$raw" | grep -Eq '^[A-Za-z_][A-Za-z0-9_]*=.+$'; then
              k="${raw%%=*}"
              v="${raw#*=}"
              # remove aspas de envoltória, se houver
              v="${v%\"}"; v="${v#\"}"; v="${v%\'}"; v="${v#\'}"
              # remove \r restantes
              k="${k%$'\r'}"; v="${v%$'\r'}"

              # Disponível AGORA neste step:
              export "$k=$v"
              # Disponível nos PRÓXIMOS steps:
              echo "$k=$v" >> "$GITHUB_ENV"

              printf '  %s=%s\n' "$k" "$v"
            fi
          done < "${PROFILE_PATH}"

          # Guard-rails neste MESMO step (agora funciona)
          if [[ -z "${KERNEL_SOURCE:-}" ]]; then
            echo "::error::KERNEL_SOURCE não definido no perfil"
            exit 2
          fi
          if [[ -z "${DEFCONFIG_NAME:-}" ]]; then
            echo "::error::DEFCONFIG_NAME não definido no perfil"
            exit 2
          fi

      - name: "(Opcional) Baixar LLVM/Clang do perfil"
        if: ${{ env.CLANG_SOURCE != '' }}
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y xz-utils curl
          mkdir -p toolchains && cd toolchains
          curl -L "$CLANG_SOURCE" -o clang.tar.xz
          tar -xJf clang.tar.xz
          CLANG_DIR="$(find "$(pwd)" -maxdepth 1 -type d -name '*clang*' | head -n1)"
          echo "CLANG_DIR=$CLANG_DIR" >> "$GITHUB_ENV"

      - name: "Instalar toolchain fallback (se não baixou clang)"
        if: ${{ env.CLANG_SOURCE == '' }}
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev \
                                  libncurses5-dev git wget curl jq python3 ccache \
                                  clang lld llvm

      - name: "Clonar fonte do Kernel (robusto a branch ausente)"
        id: clone_kernel
        shell: bash
        run: |
          set -euxo pipefail
          git --version
          rm -rf kernel-src || true

          if [[ -n "${KERNEL_REF:-}" ]]; then
            echo "Clonando por referência direta (KERNEL_REF=$KERNEL_REF)"
            git clone --depth 1 --branch "$KERNEL_REF" "$KERNEL_SOURCE" kernel-src
          else
            echo "Tentando branch: ${KERNEL_BRANCH:-<vazio>}"
            if [[ -n "${KERNEL_BRANCH:-}" ]] && git ls-remote --exit-code --heads "$KERNEL_SOURCE" "$KERNEL_BRANCH" >/dev/null 2>&1; then
              git clone --depth 1 --branch "$KERNEL_BRANCH" "$KERNEL_SOURCE" kernel-src
            else
              echo "Detectando branch padrão…"
              default_branch="$(git ls-remote --symref "$KERNEL_SOURCE" HEAD | awk '/^ref:/ {print $2}' | sed 's#refs/heads/##')"
              echo "→ default: $default_branch"
              git clone --depth 1 --branch "$default_branch" "$KERNEL_SOURCE" kernel-src
            fi
          fi

          echo "KERNEL_DIR=$GITHUB_WORKSPACE/kernel-src" >> "$GITHUB_ENV"

      - name: "Injetar KernelSU no tree do kernel"
        shell: bash
        run: |
          set -euxo pipefail
          cd "$KERNEL_DIR"
          if [[ -d KernelSU ]]; then
            echo "KernelSU já presente."
          else
            git clone --depth 1 --branch "${KERNELSU_BRANCH:-main}" "${KERNELSU_SOURCE}" KernelSU
          fi
          if ! grep -q "subdir-ccflags-y.*KernelSU/include" drivers/Makefile 2>/dev/null || true; then
            echo 'subdir-ccflags-y += -I$(srctree)/KernelSU/include' >> drivers/Makefile
          fi
          if ! grep -q "obj-y.*\bKernelSU/\b" drivers/Makefile 2>/dev/null || true; then
            echo 'obj-y += KernelSU/' >> drivers/Makefile
          fi

      - name: "Sanear Makefiles/Config (CRLF/BOM/TAB)"
        shell: bash
        run: |
          set -euxo pipefail
          cd "$KERNEL_DIR"
          # Só arquivos regulares e de texto
          git ls-files | while read -r f; do
            if [[ -f "$f" ]] && file "$f" | grep -q text; then
              sed -i 's/\r$//' "$f"
            fi
          done


      - name: "Hotfix: binder_gki.c include path (millet)"
        shell: bash
        run: |
          set -euxo pipefail
          cd "$KERNEL_DIR"
          f="drivers/android/binder_gki.c"
          if [[ -f "$f" ]]; then
            sed -i 's|#include <uapi/linux/android/binder.h>|#include <linux/android/binder.h>|' "$f" || true
          fi

      - name: "Compilar Kernel (defconfig + build)"
        shell: bash
        run: |
          set -euxo pipefail
          cd "$KERNEL_DIR"

          export ARCH=arm64 SUBARCH=arm64 LC_ALL=C
          if [[ -n "${CLANG_DIR:-}" && -d "${CLANG_DIR}" ]]; then
            export PATH="${CLANG_DIR}/bin:${PATH}"
          fi

          make O=out "${DEFCONFIG_NAME}"
          make -j"$(nproc)" O=out CC=clang LD=ld.lld LLVM=1 \
               AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip

          ls -la out/arch/arm64/boot || true

      - name: "Empacotar com AnyKernel3"
        shell: bash
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE"
          rm -rf AnyKernel3
          git clone --depth 1 --branch "${AK3_BRANCH:-master}" "${AK3_SOURCE}" AnyKernel3

          KIMG="$KERNEL_DIR/out/arch/arm64/boot/Image.gz-dtb"
          if [[ ! -f "$KIMG" ]]; then
            echo "::error::Kernel Image não encontrado em $KIMG"
            ls -la "$KERNEL_DIR/out/arch/arm64/boot" || true
            exit 2
          fi
          cp -fv "$KIMG" AnyKernel3/
          cd AnyKernel3
          zip -r9 "../kernel-${ROM_TEXT:-build}.zip" . -x "*.git*"
          echo "ZIP_PATH=$GITHUB_WORKSPACE/kernel-${ROM_TEXT:-build}.zip" >> "$GITHUB_ENV"

      - name: "Publicar artefato"
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ env.ROM_TEXT || 'build' }}
          path: ${{ env.ZIP_PATH }}
