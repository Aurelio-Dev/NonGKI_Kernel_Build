name: Build Kernel • star_hyper_a14

on:
  workflow_dispatch:
    inputs:
      PROFILE_NAME:
        description: "Nome do perfil em Profiles/ (ex.: star_hyper_a14.env)"
        required: true
        type: string
        default: "star_hyper_a14.env"
      PYTHON_VERSION:
        description: "Versão do Python usada no build (2 ou 3)"
        required: true
        type: choice
        options: ["2", "3"]
        default: "3"

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      PROFILE_NAME: ${{ inputs.PROFILE_NAME }}
      PYTHON_VERSION: ${{ inputs.PYTHON_VERSION }}

    steps:
      - name: Checkout deste repo
        uses: actions/checkout@v4

      - name: Instalar pacotes necessários
        run: |
          set -euxo pipefail
          sudo apt-get update -y
          sudo apt-get install -y \
            git curl wget bc bison flex libssl-dev build-essential ccache \
            python${PYTHON_VERSION} zip unzip rsync lz4 \
            libelf-dev libncurses5-dev libncursesw5-dev \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            llvm lld

      - name: Carregar perfil e exportar variáveis
        id: envload
        shell: bash
        run: |
          set -euo pipefail
          echo "-> Perfil: Profiles/${PROFILE_NAME}"
          test -f "Profiles/${PROFILE_NAME}" || { echo "::error::Perfil não encontrado em Profiles/${PROFILE_NAME}"; exit 2; }

          # Converte 'CUSTOM_CMDS:' e 'EXTRA_CMDS:' em exports válidos
          cp "Profiles/${PROFILE_NAME}" .profile.env
          sed -E -i \
            -e 's/^CUSTOM_CMDS: */export /' \
            -e 's/^EXTRA_CMDS: */export /' \
            .profile.env

          # Exporta todas as variáveis do perfil
          set -a
          # shellcheck disable=SC1091
          source ./.profile.env
          set +a

          # Normalizações úteis
          echo "KERNEL_SOURCE=${KERNEL_SOURCE:-<vazio>}"
          echo "KERNEL_BRANCH=${KERNEL_BRANCH:-master}"
          echo "DEFCONFIG_NAME=${DEFCONFIG_NAME:-vendor/star_defconfig}"
          echo "AK3_SOURCE=${AK3_SOURCE:-}"
          echo "CLANG_SOURCE=${CLANG_SOURCE:-}"

      - name: Obter AnyKernel3 (se não houver)
        run: |
          set -euxo pipefail
          if [ -d AnyKernel3 ]; then
            echo "AnyKernel3 já presente."
          else
            if [ -n "${AK3_SOURCE:-}" ]; then
              BR="${AK3_BRANCH:-master}"
              echo "Clonando AnyKernel3 do perfil: ${AK3_SOURCE} (branch ${BR})"
              git clone --depth=1 -b "${BR}" "${AK3_SOURCE}" AnyKernel3 || true
            fi
            if [ ! -d AnyKernel3 ]; then
              echo "Clonando AnyKernel3 padrão (osm0sis/AnyKernel3)"
              git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
            fi
          fi

      - name: (Opcional) Baixar e preparar LLVM/Clang do perfil
        if: env.CLANG_SOURCE != ''
        run: |
          set -euxo pipefail
          mkdir -p toolchains && cd toolchains
          URL="${CLANG_SOURCE}"
          F=clang.tar
          if [[ "${URL}" == *.tar.xz ]]; then
            curl -L "${URL}" -o "${F}.xz"
            tar -xf "${F}.xz"
          elif [[ "${URL}" == *.tar.gz ]]; then
            curl -L "${URL}" -o "${F}.gz"
            tar -xf "${F}.gz"
          else
            # fallback (github release asset com nome diferente)
            curl -L "${URL}" -o "clang_pkg"
            tar -xaf clang_pkg || true
          fi

          # Detecta diretório do bin
          CLANG_DIR=$(find . -maxdepth 2 -type d \( -name "clang*" -o -name "LLVM-*" -o -name "llvm-*" \) | head -n1)
          test -n "${CLANG_DIR}" || { echo "::warning::Não consegui detectar pasta do clang; usarei clang do sistema."; exit 0; }

          echo "$GITHUB_WORKSPACE/toolchains/${CLANG_DIR}/bin" >> $GITHUB_PATH
          echo "Usando toolchain em: $GITHUB_WORKSPACE/toolchains/${CLANG_DIR}/bin"

      - name: Clonar fonte do Kernel
        run: |
          set -euxo pipefail
          test -n "${KERNEL_SOURCE:-}" || { echo "::error::KERNEL_SOURCE não definido no perfil"; exit 3; }
          BR="${KERNEL_BRANCH:-master}"

          SRC="${KERNEL_SOURCE}"
          SRC="${SRC/git@github.com:/https://github.com/}"
          SRC="${SRC/ssh://git@github.com//https://github.com/}"

          rm -rf device_kernel
          git clone --depth=1 -b "${BR}" "${SRC}" device_kernel

      - name: Compilar Kernel (defconfig + build)
        run: |
          set -euxo pipefail
          cd device_kernel

          # Variáveis padrão para LLVM
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export LLVM=1
          export LLVM_IAS=1
          export LD=ld.lld

          # Se o perfil trouxe CLANG_TRIPLE, usamos como CROSS_COMPILE
          if [ -n "${CLANG_TRIPLE:-}" ]; then
            export CROSS_COMPILE="${CLANG_TRIPLE}"
          else
            export CROSS_COMPILE=aarch64-linux-gnu-
          fi
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          # Defconfig
          make "${DEFCONFIG_NAME:-vendor/star_defconfig}"

          # Build
          make -j"$(nproc)"

          # Descobrir artefatos do kernel
          OUT=arch/arm64/boot
          DEST="$GITHUB_WORKSPACE/ak_out"
          mkdir -p "$DEST"

          IMG=""
          for cand in Image.gz-dtb Image-dtb Image.gz Image; do
            if [ -f "$OUT/$cand" ]; then IMG="$OUT/$cand"; break; fi
          done

          if [ -z "$IMG" ]; then
            echo "::error::Não encontrei Image/Image.gz/Image.gz-dtb em $OUT"
            ls -l "$OUT" || true
            exit 4
          fi

          cp -v "$IMG" "$DEST/"

          # Copiamos dtbo/img/dtb se existirem (opcional)
          [ -f "$OUT/dtbo.img" ] && cp -v "$OUT/dtbo.img" "$DEST/"
          if compgen -G "$OUT/dts/**/*.dtb" > /dev/null; then
            mkdir -p "$DEST/dtb"
            find "$OUT/dts" -name "*.dtb" -exec cp -v {} "$DEST/dtb/" \;
          fi

      - name: Empacotar com AnyKernel3
        run: |
          set -euxo pipefail
          cd AnyKernel3

          # Nome amigável do device/ROM (ajuste conforme necessidade)
          DEVICE="star_hyper_a14"
          DATE="$(date +%Y%m%d-%H%M)"
          ZIP="Kernel-${DEVICE}-${DATE}.zip"

          # Copia imagem para a pasta do AK3 com nomes esperados
          SRC="$GITHUB_WORKSPACE/ak_out"
          if [ -f "$SRC/Image.gz-dtb" ]; then
            cp -vf "$SRC/Image.gz-dtb" ./Image.gz-dtb
          elif [ -f "$SRC/Image-dtb" ]; then
            cp -vf "$SRC/Image-dtb" ./Image.gz-dtb
          elif [ -f "$SRC/Image.gz" ]; then
            # Alguns AK3 esperam Image.gz-dtb; quando só há Image.gz, deixamos como Image
            cp -vf "$SRC/Image.gz" ./Image
          elif [ -f "$SRC/Image" ]; then
            cp -vf "$SRC/Image" ./Image
          fi

          # dtbo opcional
          [ -f "$SRC/dtbo.img" ] && cp -vf "$SRC/dtbo.img" ./dtbo.img || true

          # dtb(s) opcionais
          if [ -d "$SRC/dtb" ]; then
            mkdir -p ./dtb
            cp -rvf "$SRC/dtb/"* ./dtb/ || true
          fi

          # Gera zip
          zip -r9 "../${ZIP}" ./*

          echo "AK_ZIP=${ZIP}" >> $GITHUB_ENV

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.AK_ZIP }}
          path: ${{ github.workspace }}/${{ env.AK_ZIP }}
