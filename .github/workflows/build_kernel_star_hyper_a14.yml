name: Build Kernel • Star Hyper A14

on:
  workflow_dispatch:
    inputs:
      PROFILE_NAME:
        description: "Nome do arquivo em Profiles/ (ex.: star_hyper_a14.env)"
        required: true
        default: "star_hyper_a14.env"

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Carregar perfil
        id: load_env
        shell: bash
        run: |
          set -euo pipefail
          PROFILE_PATH="Profiles/${{ github.event.inputs.PROFILE_NAME }}"
          if [[ ! -f "$PROFILE_PATH" ]]; then
            echo "::error::Arquivo de perfil não encontrado: $PROFILE_PATH"
            ls -la Profiles || true
            exit 2
          fi
          sed -i 's/\r$//' "$PROFILE_PATH"
          echo "→ Usando perfil: $PROFILE_PATH"
          while IFS= read -r raw || [[ -n "$raw" ]]; do
            [[ -z "$raw" ]] && continue
            [[ "$raw" =~ ^[[:space:]]*# ]] && continue
            if printf '%s' "$raw" | grep -Eq '^[A-Za-z_][A-Za-z0-9_]*=.+$'; then
              k="${raw%%=*}"; v="${raw#*=}"
              v="${v%\"}"; v="${v#\"}"; v="${v%\'}"; v="${v#\'}"
              k="${k%$'\r'}"; v="${v%$'\r'}"
              export "$k=$v"
              echo "$k=$v" >> "$GITHUB_ENV"
              printf '  %s=%s\n' "$k" "$v"
            fi
          done < "$PROFILE_PATH"
          [[ -n "${KERNEL_SOURCE:-}" ]]  || { echo "::error::KERNEL_SOURCE não definido no perfil"; exit 2; }
          [[ -n "${DEFCONFIG_NAME:-}" ]] || { echo "::error::DEFCONFIG_NAME não definido no perfil"; exit 2; }

      - name: (Opcional) Baixar LLVM/Clang do perfil
        if: ${{ env.CLANG_SOURCE != '' }}
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y xz-utils curl
          mkdir -p toolchains && cd toolchains
          curl -L "$CLANG_SOURCE" -o clang.tar.xz
          tar -xJf clang.tar.xz
          CLANG_DIR="$(find "$(pwd)" -maxdepth 1 -type d -name '*clang*' | head -n1)"
          echo "CLANG_DIR=$CLANG_DIR" >> "$GITHUB_ENV"

      - name: Instalar toolchain fallback
        if: ${{ env.CLANG_SOURCE == '' }}
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev \
                                  libncurses5-dev git wget curl jq python3 ccache \
                                  clang lld llvm

      - name: Clonar fonte do Kernel
        id: clone_kernel
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf kernel-src || true
          if [[ -n "${KERNEL_REF:-}" ]]; then
            git clone --depth 1 --branch "$KERNEL_REF" "$KERNEL_SOURCE" kernel-src
          else
            if [[ -n "${KERNEL_BRANCH:-}" ]] && git ls-remote --exit-code --heads "$KERNEL_SOURCE" "$KERNEL_BRANCH" >/dev/null 2>&1; then
              git clone --depth 1 --branch "$KERNEL_BRANCH" "$KERNEL_SOURCE" kernel-src
            else
              default_branch="$(git ls-remote --symref "$KERNEL_SOURCE" HEAD | awk '/^ref:/ {print $2}' | sed 's#refs/heads/##')"
              git clone --depth 1 --branch "$default_branch" "$KERNEL_SOURCE" kernel-src
            fi
          fi
          echo "KERNEL_DIR=$GITHUB_WORKSPACE/kernel-src" >> "$GITHUB_ENV"
          mkdir -p "$GITHUB_WORKSPACE/kernel-src/out"

      - name: Injetar KernelSU (drivers/kernelsu)
        shell: bash
        run: |
          set -euxo pipefail
          cd "$KERNEL_DIR"
          rm -rf KernelSU drivers/kernelsu drivers/KernelSU ksu_tmp || true
          mkdir -p drivers
          git clone --depth 1 --branch "${KERNELSU_BRANCH:-main}" "${KERNELSU_SOURCE}" ksu_tmp
          CAND_DIR=""
          for d in "ksu_tmp/KernelSU" "ksu_tmp/kernel" "ksu_tmp"; do
            if [[ -f "$d/Makefile" ]]; then CAND_DIR="$d"; break; fi
          done
          [[ -n "$CAND_DIR" ]] || { echo "::error::Não achei Makefile do KernelSU no repositório"; exit 2; }
          mkdir -p drivers/kernelsu
          cp -a "${CAND_DIR}/." drivers/kernelsu/
          if [[ ! -f drivers/kernelsu/Kconfig && -f drivers/kernelsu/kernel/Kconfig ]]; then
            cp -f drivers/kernelsu/kernel/Kconfig drivers/kernelsu/Kconfig
          fi
          ln -sfn kernelsu drivers/KernelSU
          # limpa possíveis linhas antigas
          sed -i '/obj-y[[:space:]]\+\+=\s*KernelSU\//d' drivers/Makefile || true
          sed -i '/obj-y[[:space:]]\+\+=\s*kernelsu\//d' drivers/Makefile || true
          sed -i '/source\s*"drivers\/KernelSU\/Kconfig"/d' drivers/Kconfig || true
          sed -i '/source\s*"drivers\/kernelsu\/Kconfig"/d' drivers/Kconfig || true
          # adiciona de forma idempotente
          grep -qE '(^|[[:space:]])obj-y[[:space:]]*\+=[[:space:]]*kernelsu/' drivers/Makefile 2>/dev/null || \
            echo 'obj-y += kernelsu/' >> drivers/Makefile
          if ! grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig 2>/dev/null; then
            printf '\nsource "drivers/kernelsu/Kconfig"\n' >> drivers/Kconfig
          fi
          awk '!x[$0]++' drivers/Makefile > .mk && mv .mk drivers/Makefile
          awk '!x[$0]++' drivers/Kconfig  > .kc && mv .kc drivers/Kconfig

      - name: Saneamento de texto (CRLF/TAB/BOM)
        shell: bash
        run: |
          set -euxo pipefail
          cd "$KERNEL_DIR"
          git ls-files -z \
            | xargs -0 file --mime-type \
            | grep 'text/' \
            | cut -d: -f1 \
            | xargs -r sed -i 's/\r$//'

      - name: Hotfix EROFS (warning → não-erro)
        shell: bash
        run: |
          set -euo pipefail
          cd "$KERNEL_DIR"
          f="fs/erofs/inode.c"
          if [[ -f "$f" ]] && grep -qE '\bloff_t[[:space:]]+off;' "$f"; then
            sed -i 's/\bloff_t[[:space:]]\+off;/__maybe_unused loff_t off;/' "$f"
            echo "→ Hotfix aplicado em $f"
          fi

      - name: Limpeza de vestígios de build no source
        shell: bash
        run: |
          set -euxo pipefail
          cd "$KERNEL_DIR"
          rm -rf include/config arch/arm64/include/generated .config .config.old || true
          mkdir -p out

      - name: Configurar e compilar (robusto)
        shell: bash
        run: |
          set -euo pipefail
          cd "$KERNEL_DIR"

          want="${DEFCONFIG_NAME}"
          base="${want##*/}"
          base="${base#vendor/}"                 # remove vendor/ se vier
          base="${base#arch/arm64/configs/}"     # normaliza
          [[ "$base" == *_defconfig ]] || base="${base}_defconfig"

          found=""
          # 1) exato no caminho informado
          if [[ -f "arch/arm64/configs/${want}" ]]; then
            found="${want}"
          elif [[ -f "arch/arm64/configs/${base}" ]]; then
            found="${base}"
          else
            # 2) busca exata em toda a árvore
            cand="$(find arch/arm64/configs -type f -name "${base}" -print -quit 2>/dev/null || true)"
            if [[ -n "$cand" ]]; then
              found="${cand#arch/arm64/configs/}"
            else
              # 3) fuzzy por prefixo (ex.: star_hyper_a14_defconfig)
              prefix="${base%_defconfig}"
              cand="$(find arch/arm64/configs -type f -name "*${prefix}*_defconfig" | head -n1 || true)"
              [[ -n "$cand" ]] && found="${cand#arch/arm64/configs/}"
            fi
          fi

          # 4) fallback para GKI
          if [[ -z "$found" ]]; then
            if [[ -f arch/arm64/configs/vendor/gki_defconfig ]]; then
              found="vendor/gki_defconfig"
            elif [[ -f arch/arm64/configs/gki_defconfig ]]; then
              found="gki_defconfig"
            else
              echo "::error::Defconfig '${want}' não encontrado e não há gki_defconfig no tree."
              echo "Alguns disponíveis:"
              find arch/arm64/configs -maxdepth 2 -name "*defconfig" | head -n 200 || true
              exit 2
            fi
            echo "::warning::Usando fallback: ${found}"
          fi

          echo "→ Defconfig final: ${found}"

          # 5) gera .config e sincroniza sem 'yes' (evita Broken pipe)
          make O=out ARCH=arm64 "${found}" V=1 2>&1 | tee build.log
          KCONFIG_NONINTERACTIVE=1 make O=out ARCH=arm64 olddefconfig 2>&1 | tee -a build.log
          make O=out ARCH=arm64 syncconfig 2>&1 | tee -a build.log

          # 6) opcional: desabilitar zram/zsmalloc se o seu tree acusar -Werror neles
          if [[ -x ./scripts/config ]]; then
            ./scripts/config --file out/.config -d CONFIG_ZRAM     || true
            ./scripts/config --file out/.config -d CONFIG_ZSMALLOC || true
            KCONFIG_NONINTERACTIVE=1 make O=out ARCH=arm64 olddefconfig 2>&1 | tee -a build.log
          fi

          # 7) build
          set +e
          make -j"$(nproc)" \
               O=out ARCH=arm64 LLVM=1 CC=clang LD=ld.lld \
               AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
               HOSTCC=clang HOSTCXX=clang++ V=1 \
               2>&1 | tee -a build.log
          rc=${PIPESTATUS[0]}
          set -e
          exit "$rc"

      - name: Diagnóstico de falha (se houver)
        if: failure()
        shell: bash
        run: |
          set -euxo pipefail
          cd "$KERNEL_DIR"
          echo "=== HEAD do log (200) ==="; head -n 200 build.log || true
          echo "=== TAIL do log (200) ==="; tail -n 200 build.log || true
          echo "=== Erros ±3 ==="
          grep -nEi -C3 '(^| )(error:|fatal error:|undefined reference|No rule to make target|No such file or directory)' build.log || true
          echo "=== .config (parcial) ==="
          test -f out/.config && sed -n '1,160p' out/.config || true

      - name: Upload de logs e .config
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-kernel-logs
          path: |
            ${{ env.KERNEL_DIR }}/build.log
            ${{ env.KERNEL_DIR }}/out/.config
